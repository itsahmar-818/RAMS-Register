  --hero-chip:rgba(255,255,255,.08);

  --font:"RInter","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --sh-1:0 1px 2px rgba(13,22,38,.05),0 1px 1px rgba(13,22,38,.03);
  --sh-2:0 6px 18px -6px rgba(13,22,38,.14),0 2px 4px rgba(13,22,38,.04);
  --sh-3:0 22px 48px -16px rgba(13,22,38,.30);

  --nav-h:68px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#070C14;
  --surface:#0F1723;
  --surface-2:#141E2C;
  --surface-3:#1B2737;
  --line:#1E2A3B;
  --line-2:#2A384C;
  --ink:#E9EEF5;
  --ink-2:#C5CFDC;
  --sub:#8D9AAD;
  --mute:#5E6B7E;
  --brand:#22C38B;
  --brand-strong:#34D399;
  --brand-ink:#7EE8BF;
  --brand-soft:#0F2C24;
  --amber:#F0A936; --amber-soft:#2C2312; --amber-ink:#F7C873;
  --red:#F06464;   --red-soft:#311617;   --red-ink:#FF9C9C;
  --blue:#6A9CFF;  --blue-soft:#14223D;  --blue-ink:#A9C4FF;
  --orange:#FF8A57;--orange-soft:#2F1B12;
  --violet:#A193FF;--violet-soft:#1F1A3A;
  --hero-1:#0B1726;
  --hero-2:#0B2B26;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 8px 22px -8px rgba(0,0,0,.6);
  --sh-3:0 24px 56px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none;font-feature-settings:"cv11","ss01";}
button,input,select,textarea{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;
  border:none;background:none;margin:0;}
button{cursor:pointer;padding:0;text-align:inherit;}
a{color:inherit;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
[hidden]{display:none!important;}
.n,.amt,.num{font-variant-numeric:tabular-nums;}
button,.tab,.pill,.chipf{-webkit-user-select:none;user-select:none;touch-action:manipulation;}
::selection{background:color-mix(in srgb,var(--brand) 28%,transparent);}

#shell{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;}
main{padding:0 16px calc(var(--nav-h) + var(--sab) + 34px);}
.view{animation:vin .34s cubic-bezier(.2,.9,.25,1);}
@keyframes vin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ─── top bar (non-home tabs) ─────────────────────────── */
.topbar{position:sticky;top:0;z-index:40;padding:calc(var(--sat) + 14px) 16px 12px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  display:flex;align-items:center;gap:12px;margin:0 -16px 6px;}
.topbar h1{font-size:24px;font-weight:800;letter-spacing:-.025em;margin:0;line-height:1.1;}
.topbar .tsub{font-size:12.5px;color:var(--sub);margin-top:2px;font-weight:500;}
.topbar .grow{flex:1;min-width:0;}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);box-shadow:var(--sh-1);}
.iconbtn:active{transform:scale(.94);}

/* ─── hero (home) ─────────────────────────────────────── */
.hero{position:relative;overflow:hidden;margin:0 -16px 0;padding:calc(var(--sat) + 16px) 18px 22px;
  color:var(--hero-ink);border-radius:0 0 30px 30px;
  background:
    radial-gradient(120% 90% at 100% 0%,rgba(52,211,153,.30) 0%,transparent 55%),
    radial-gradient(90% 70% at 0% 100%,rgba(14,164,114,.22) 0%,transparent 60%),
    linear-gradient(160deg,var(--hero-1) 0%,var(--hero-2) 100%);
  box-shadow:0 18px 40px -22px rgba(6,40,30,.7);}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-mask-image:linear-gradient(200deg,#000 0%,transparent 55%);
          mask-image:linear-gradient(200deg,#000 0%,transparent 55%);}
.hero > *{position:relative;z-index:1;}
:root[data-theme="dark"] .hero{border:1px solid var(--line);border-top:0;}
.hrow1{display:flex;align-items:center;gap:12px;}
.logo{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#34D399,#059669);color:#04221A;
  box-shadow:0 6px 16px -4px rgba(16,185,129,.6),inset 0 1px 0 rgba(255,255,255,.35);}
.hello{flex:1;min-width:0;}
.hello small{display:block;font-size:12px;color:var(--hero-sub);font-weight:500;}
.hello b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.hbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:var(--hero-chip);border:1px solid var(--hero-line);color:var(--hero-ink);}
.hbtn:active{background:rgba(255,255,255,.16);}

.mswitch{display:flex;align-items:center;gap:6px;margin:18px 0 0;}
.mswitch button{height:36px;border-radius:11px;background:var(--hero-chip);border:1px solid var(--hero-line);
  color:var(--hero-ink);display:grid;place-items:center;}
.mswitch .arr{width:36px;flex:none;}
.mswitch .cur{flex:1;font-size:13.5px;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;
  justify-content:center;gap:7px;}
.mswitch .cur i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:#04221A;background:var(--brand-glow);border-radius:6px;padding:2px 6px;}

.hlabel{margin-top:20px;font-size:12px;font-weight:600;color:var(--hero-sub);letter-spacing:.02em;
  display:flex;align-items:center;gap:8px;}
.hlabel .dot{width:7px;height:7px;border-radius:50%;background:#F59E0B;box-shadow:0 0 0 4px rgba(245,158,11,.18);}
.hlabel .dot.ok{background:var(--brand-glow);box-shadow:0 0 0 4px rgba(52,211,153,.18);}
.hamt{font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1.08;margin-top:4px;
  font-variant-numeric:tabular-nums;}
.hamt small{font-size:18px;font-weight:600;color:var(--hero-sub);margin-right:4px;letter-spacing:0;}
.hprog{margin-top:16px;}
.hprog .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;}
.hprog .bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#10B981,#6EE7B7);box-shadow:0 0 12px rgba(52,211,153,.6);
  transition:width .6s cubic-bezier(.2,.9,.25,1);}
.hprog .lg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--hero-sub);margin-top:7px;font-weight:500;}
.hprog .lg b{color:var(--hero-ink);font-weight:700;}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
.hstat{background:var(--hero-chip);border:1px solid var(--hero-line);border-radius:14px;padding:10px 11px;}
.hstat span{display:block;font-size:10.5px;color:var(--hero-sub);font-weight:600;letter-spacing:.02em;}
.hstat b{display:block;font-size:15px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hstat b.g{color:#6EE7B7;} .hstat b.r{color:#FCA5A5;}

/* ─── section headings ────────────────────────────────── */
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px;}
.sec h2{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0;}
.sec .cnt{font-size:12px;color:var(--sub);font-weight:600;}
.sec .lnk{font-size:12.5px;font-weight:700;color:var(--brand-strong);}

/* ─── filter chips ────────────────────────────────────── */
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:18px -16px 0;padding:0 16px 2px;}
.chips::-webkit-scrollbar{display:none;}
.chipf{flex:none;height:34px;padding:0 13px;border-radius:99px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
  color:var(--ink-2);box-shadow:var(--sh-1);transition:background .18s,color .18s,border-color .18s;}
.chipf em{font-style:normal;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:99px;
  display:inline-grid;place-items:center;padding:0 6px;background:var(--surface-3);color:var(--sub);}
.chipf.on{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.chipf.on em{background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg);}

/* ─── cards ───────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-2);margin-bottom:12px;overflow:hidden;}
.card.pad{padding:16px;}
.phead{display:flex;align-items:center;gap:12px;padding:14px 14px 12px;width:100%;text-align:left;}
.av{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;
  font-size:14px;font-weight:800;letter-spacing:-.01em;}
.av.c0{background:var(--brand-soft);color:var(--brand-ink);}
.av.c1{background:var(--blue-soft);color:var(--blue-ink);}
.av.c2{background:var(--violet-soft);color:var(--violet);}
.av.c3{background:var(--amber-soft);color:var(--amber-ink);}
.av.c4{background:var(--orange-soft);color:var(--orange);}
.pinfo{flex:1;min-width:0;}
.pinfo b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.015em;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pinfo span{display:block;font-size:12.5px;color:var(--sub);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:500;}
.pinfo span strong{color:var(--ink-2);font-weight:600;}
.pmeter{display:flex;align-items:center;gap:10px;padding:0 14px 12px;}
.pmeter .bar{flex:1;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
.pmeter .bar i{display:block;height:100%;border-radius:99px;background:var(--brand);}
.pmeter span{font-size:11.5px;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums;}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;
  font-size:11.5px;font-weight:700;white-space:nowrap;flex:none;letter-spacing:.005em;}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill.nodot::before{display:none;}
.pill.ok{background:var(--brand-soft);color:var(--brand-ink);}
.pill.due{background:var(--amber-soft);color:var(--amber-ink);}
.pill.late{background:var(--red-soft);color:var(--red-ink);}
.pill.none{background:var(--surface-3);color:var(--sub);}
.pill.info{background:var(--blue-soft);color:var(--blue-ink);}

/* item rows */
.items{border-top:1px solid var(--line);}
.irow{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;}
.irow + .irow{border-top:1px solid var(--line);}
.irow:active{background:var(--surface-2);}
.kic{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;}
.kic.rent{background:var(--brand-soft);color:var(--brand-strong);}
.kic.electric{background:var(--amber-soft);color:var(--amber);}
.kic.gas{background:var(--orange-soft);color:var(--orange);}
.kic.water{background:var(--blue-soft);color:var(--blue);}
.imid{flex:1;min-width:0;text-align:left;}
.imid b{display:block;font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;}
.imid span{display:block;font-size:12px;color:var(--sub);margin-top:1px;font-weight:500;}
.imid span.late{color:var(--red);font-weight:600;}
.iamt{text-align:right;flex:none;}
.iamt b{display:block;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.iamt b.no{color:var(--mute);font-weight:500;}
.iamt b.paid{color:var(--sub);}
.iamt span{display:block;font-size:11px;font-weight:600;margin-top:1px;}
.iamt span.due{color:var(--amber);} .iamt span.late{color:var(--red);} .iamt span.ok{color:var(--brand-strong);}
.iamt span.none{color:var(--mute);}
.tick{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:2px solid var(--line-2);color:transparent;transition:all .2s cubic-bezier(.2,.9,.25,1);}
.tick.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 10px -3px color-mix(in srgb,var(--brand) 70%,transparent);}
.tick:active{transform:scale(.86);}
.tick.pop{animation:pop .38s cubic-bezier(.2,.9,.25,1.4);}
@keyframes pop{0%{transform:scale(.7);}60%{transform:scale(1.12);}100%{transform:scale(1);}}

/* reference numbers block */
.refs{background:var(--surface-2);border-top:1px solid var(--line);padding:6px 14px;}
.ref{display:flex;align-items:center;gap:10px;padding:8px 0;}
.ref + .ref{border-top:1px dashed var(--line-2);}
.ref .rl{flex:1;min-width:0;}
.ref .rl small{display:block;font-size:11px;color:var(--sub);font-weight:600;}
.ref .rl b{display:block;font-size:14px;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ref .rl b.no{color:var(--mute);font-weight:500;letter-spacing:0;font-size:13px;}
.mini{height:30px;padding:0 11px;border-radius:9px;font-size:12px;font-weight:700;flex:none;
  display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);
  color:var(--ink-2);text-decoration:none;}
.mini:active{background:var(--brand);color:#fff;border-color:var(--brand);}

/* action bar on card */
.acts{display:flex;gap:6px;padding:10px 12px 12px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;}
.acts::-webkit-scrollbar{display:none;}
.act{flex:none;height:34px;padding:0 12px;border-radius:10px;font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);color:var(--ink-2);
  border:1px solid var(--line);text-decoration:none;}
.act:active{background:var(--surface-3);}
.act.wa{background:#E6F8EE;color:#0B7A43;border-color:#C9EED9;}
:root[data-theme="dark"] .act.wa{background:#0E2A1C;color:#5BE39A;border-color:#17402B;}
.act.sp{margin-left:auto;}
.act.ic{width:34px;padding:0;justify-content:center;}

/* attention list */
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);margin-bottom:10px;}
.alert .ai{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;}
.alert.warn .ai{background:var(--amber-soft);color:var(--amber);}
.alert.info .ai{background:var(--blue-soft);color:var(--blue);}
.alert.bad .ai{background:var(--red-soft);color:var(--red);}
.alert .at{flex:1;min-width:0;}
.alert .at b{display:block;font-size:13.5px;font-weight:700;}
.alert .at span{display:block;font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.45;}
.alert .at button{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--brand-strong);}
.alert .x{color:var(--mute);width:26px;height:26px;display:grid;place-items:center;flex:none;}

/* overdue strip */
.odue{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px;}
.odue::-webkit-scrollbar{display:none;}
.ocard{flex:none;width:200px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--red);
  border-radius:16px;padding:12px 13px;box-shadow:var(--sh-1);text-align:left;}
.ocard small{display:block;font-size:11px;color:var(--red);font-weight:700;letter-spacing:.02em;}
.ocard b{display:block;font-size:14px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ocard span{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ocard .oa{font-size:17px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}

/* ─── search + toolbar ───────────────────────────────── */
.search{position:relative;margin-bottom:10px;}
.search input{width:100%;height:46px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  padding:0 14px 0 44px;font-size:15px;font-weight:500;box-shadow:var(--sh-1);}
.search input::placeholder{color:var(--mute);}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 16%,transparent);}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mute);}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:14px;}
.segm{display:flex;background:var(--surface-3);border-radius:12px;padding:3px;flex:1;}
.segm button{flex:1;height:32px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--sub);transition:all .2s;}
.segm button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);}
.sortbtn{height:38px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);flex:none;}

/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--sh-1);}
.tile span{display:block;font-size:11px;color:var(--sub);font-weight:600;}
.tile b{display:block;font-size:16px;font-weight:800;margin-top:3px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile b.g{color:var(--brand-strong);}
.tile.dark{background:linear-gradient(150deg,var(--hero-1),var(--hero-2));border-color:transparent;color:var(--hero-ink);}
.tile.dark span{color:var(--hero-sub);}

/* property list card */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);}
.pgrid div{padding:10px 14px;}
.pgrid div + div{border-left:1px solid var(--line);}
.pgrid span{display:block;font-size:10.5px;color:var(--sub);font-weight:600;letter-spacing:.02em;text-transform:uppercase;}
.pgrid b{display:block;font-size:13.5px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chev{color:var(--mute);flex:none;display:grid;place-items:center;}

/* ─── reports ────────────────────────────────────────── */
.chart{display:flex;align-items:flex-end;gap:5px;height:140px;padding:8px 2px 0;}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0;}
.chart .stk{width:100%;max-width:20px;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;
  background:var(--surface-3);min-height:4px;}
.chart .stk i{display:block;width:100%;}
.chart .stk i.p{background:linear-gradient(180deg,#34D399,var(--brand));}
.chart .stk i.o{background:var(--amber);opacity:.8;}
.chart .col span{font-size:9.5px;color:var(--sub);font-weight:700;}
.chart .col.cur span{color:var(--ink);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);font-weight:600;margin-top:12px;}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
.hm{display:flex;align-items:center;gap:10px;padding:11px 0;}
.hm + .hm{border-top:1px solid var(--line);}
.hm .hn{width:96px;flex:none;min-width:0;}
.hm .hn b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hm .hn span{display:block;font-size:11px;color:var(--sub);font-weight:600;}
.hm .cells{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:3px;}
.hm .cells i{height:22px;border-radius:5px;background:var(--surface-3);display:block;}
.hm .cells i.all{background:var(--brand);}
.hm .cells i.some{background:var(--amber);opacity:.85;}
.hm .cells i.nil{background:var(--red);opacity:.85;}
.hmhead{display:flex;gap:10px;padding:0 0 4px;}
.hmhead .sp{width:96px;flex:none;}
.hmhead .ms{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:3px;}
.hmhead .ms span{font-size:9px;color:var(--sub);font-weight:700;text-align:center;}

/* ─── settings ───────────────────────────────────────── */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);
  overflow:hidden;margin-bottom:8px;}
.glabel{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;
  margin:22px 4px 8px;}
.gnote{font-size:12px;color:var(--sub);margin:0 4px 6px;line-height:1.5;}
.srow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;min-height:58px;}
.srow + .srow{border-top:1px solid var(--line);}
button.srow:active,label.srow:active{background:var(--surface-2);}
.sic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;}
.sic.g{background:linear-gradient(145deg,#34D399,#059669);}
.sic.b{background:linear-gradient(145deg,#60A5FA,#2563EB);}
.sic.v{background:linear-gradient(145deg,#A78BFA,#6D28D9);}
.sic.a{background:linear-gradient(145deg,#FBBF24,#D97706);}
.sic.o{background:linear-gradient(145deg,#FB923C,#EA580C);}
.sic.r{background:linear-gradient(145deg,#F87171,#DC2626);}
.sic.s{background:linear-gradient(145deg,#94A3B8,#475569);}
.sic.k{background:linear-gradient(145deg,#334155,#0F172A);}
.stx{flex:1;min-width:0;}
.stx b{display:block;font-size:14.5px;font-weight:600;}
.stx span{display:block;font-size:12.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sval{font-size:13.5px;color:var(--sub);font-weight:600;flex:none;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.srow.danger .stx b{color:var(--red);}
.profile{display:flex;align-items:center;gap:14px;padding:16px;}
.profile .big{width:56px;height:56px;border-radius:18px;font-size:20px;}
.profile .stx b{font-size:17px;font-weight:700;}
.tg{position:relative;width:50px;height:30px;flex:none;}
.tg input{position:absolute;inset:0;opacity:0;z-index:2;margin:0;cursor:pointer;width:100%;height:100%;}
.tg i{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:background .2s;}
.tg i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.2,.9,.25,1.2);}
.tg input:checked + i{background:var(--brand);}
.tg input:checked + i::after{transform:translateX(20px);}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px 14px;}
.themes button{border-radius:14px;border:2px solid var(--line);padding:8px;text-align:center;font-size:12px;font-weight:600;color:var(--ink-2);}
.themes button.on{border-color:var(--brand);color:var(--brand-strong);}
.themes .sw{height:44px;border-radius:9px;margin-bottom:6px;display:flex;overflow:hidden;border:1px solid var(--line);}
.themes .sw i{flex:1;}
.verfoot{text-align:center;font-size:12px;color:var(--mute);margin:22px 0 4px;line-height:1.6;font-weight:500;}

/* ─── empty / welcome ────────────────────────────────── */
.empty{text-align:center;padding:40px 20px;}
.empty .ei{width:76px;height:76px;border-radius:24px;margin:0 auto 16px;display:grid;place-items:center;
  background:linear-gradient(145deg,#34D399,#059669);color:#fff;box-shadow:0 14px 30px -10px rgba(5,150,105,.6);}
.empty h3{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;}
.empty p{font-size:14px;color:var(--sub);margin:0 auto 20px;max-width:290px;line-height:1.55;}
.steps{text-align:left;margin-top:22px;display:flex;flex-direction:column;gap:12px;}
.steps div{display:flex;gap:12px;align-items:flex-start;}
.steps i{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-style:normal;
  font-size:12px;font-weight:800;background:var(--brand-soft);color:var(--brand-ink);}
.steps p{margin:0;font-size:13px;color:var(--sub);line-height:1.5;max-width:none;}
.steps b{color:var(--ink);}
.nores{text-align:center;color:var(--sub);font-size:13.5px;padding:30px 10px;}

/* ─── buttons ────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;
  border-radius:15px;font-size:15px;font-weight:700;letter-spacing:-.005em;text-decoration:none;
  transition:transform .12s,background .2s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 10px 22px -10px color-mix(in srgb,var(--brand) 80%,transparent);}
.btn-primary:active{background:var(--brand-strong);}
.btn-dark{background:var(--ink);color:var(--bg);}
.btn-ghost{background:var(--surface-3);color:var(--ink);}
.btn-danger{background:var(--red-soft);color:var(--red-ink);}
.btn[disabled]{opacity:.4;pointer-events:none;}
.brow{display:flex;gap:8px;margin-top:18px;}
.brow .btn:first-child{flex:0 0 36%;}
.btn + .btn{margin-top:8px;}
.brow .btn + .btn{margin-top:0;}

/* ─── bottom nav ─────────────────────────────────────── */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sab));z-index:60;
  width:min(428px,calc(100% - 24px));height:var(--nav-h);border-radius:22px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(1.5) blur(18px);-webkit-backdrop-filter:saturate(1.5) blur(18px);
  border:1px solid var(--line);box-shadow:var(--sh-3);display:flex;align-items:center;padding:0 6px;}
.tab{flex:1;height:54px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--mute);transition:color .2s;position:relative;}
.tab span{font-size:10.5px;font-weight:700;letter-spacing:.01em;}
.tab.on{color:var(--ink);}
.tab.on::before{content:"";position:absolute;top:3px;width:18px;height:3px;border-radius:99px;background:var(--brand);}
.fabtab{flex:none;width:56px;height:56px;border-radius:18px;margin:0 4px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,#34D399,#059669);box-shadow:0 10px 22px -8px rgba(5,150,105,.75),inset 0 1px 0 rgba(255,255,255,.3);
  transform:translateY(-14px);transition:transform .15s;}
.fabtab:active{transform:translateY(-14px) scale(.92);}

/* ─── sheet ──────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(5,10,18,.55);opacity:0;transition:opacity .28s;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
.scrim.on{opacity:1;}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(104%);z-index:90;
  width:min(460px,100%);max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border-radius:28px 28px 0 0;padding:8px 18px calc(22px + var(--sab));
  box-shadow:var(--sh-3);transition:transform .38s cubic-bezier(.2,.9,.25,1);}
.sheet.on{transform:translateX(-50%) translateY(0);}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line-2);margin:4px auto 16px;}
.sheet .eyb{font-size:12px;font-weight:700;color:var(--brand-strong);letter-spacing:.02em;margin-bottom:4px;}
.sheet h3{font-size:22px;font-weight:800;letter-spacing:-.025em;margin:0 0 4px;line-height:1.2;}
.sheet .ssub{font-size:13.5px;color:var(--sub);margin:0 0 18px;line-height:1.5;}
.sheet .shd{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.sheet .shd .kic{width:46px;height:46px;border-radius:14px;}
.sheet .shd h3{margin:0;}
.sheet .shd small{display:block;font-size:12.5px;color:var(--sub);font-weight:500;}
.wprog{display:flex;gap:4px;margin-bottom:16px;}
.wprog i{flex:1;height:4px;border-radius:99px;background:var(--surface-3);}
.wprog i.on{background:var(--brand);}
.skip{width:100%;text-align:center;font-size:13px;font-weight:600;color:var(--sub);padding:14px 0 2px;}

/* fields */
.field{margin-bottom:14px;}
.field > label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px;}
.input{width:100%;height:50px;padding:0 15px;font-size:16px;font-weight:500;border-radius:14px;
  background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink);caret-color:var(--brand);
  transition:border-color .15s,box-shadow .15s;}
.input::placeholder{color:var(--mute);font-weight:400;}
.input:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 14%,transparent);}
.money{position:relative;}
.money span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:700;color:var(--sub);}
.money .input{height:64px;font-size:28px;font-weight:800;letter-spacing:-.02em;padding-left:52px;font-variant-numeric:tabular-nums;}
select.input{background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23647287' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 14px center;background-size:16px;padding-right:40px;}
textarea.input{height:auto;min-height:110px;padding:12px 14px;font-size:13px;line-height:1.5;resize:vertical;}
.hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.45;}
.paidbox{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2);
  border:1.5px solid var(--line);margin-bottom:14px;cursor:pointer;}
.paidbox b{flex:1;font-size:14.5px;font-weight:600;}
.paidbox.on{border-color:var(--brand);background:var(--brand-soft);}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.quick button{height:30px;padding:0 11px;border-radius:9px;background:var(--surface-3);font-size:12px;font-weight:600;color:var(--ink-2);}
.more{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--brand-strong);padding:4px 0 12px;}
.pick{display:flex;flex-direction:column;gap:10px;}
.pick button{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:18px;
  background:var(--surface-2);border:1.5px solid var(--line);}
.pick button:active{border-color:var(--brand);background:var(--brand-soft);}
.pick b{display:block;font-size:15.5px;font-weight:700;}
.pick span{display:block;font-size:12.5px;color:var(--sub);margin-top:2px;}
.ktype{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.ktype button{border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);padding:12px 6px;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);}
.ktype button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);}
.dsec{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;margin:20px 2px 8px;}
.dlist{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.dlist .srow{min-height:54px;}
.addm{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;margin-top:10px;
  border-radius:14px;border:1.5px dashed var(--line-2);font-size:13.5px;font-weight:700;color:var(--ink-2);}
.addm:active{border-color:var(--brand);color:var(--brand-strong);}
.sortlist button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;font-size:15px;font-weight:600;}
.sortlist button + button{border-top:1px solid var(--line);}
.sortlist button i{margin-left:auto;color:var(--brand);font-style:normal;}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--sab) + 26px);z-index:100;
  transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:11px 16px 11px 13px;border-radius:14px;font-size:13.5px;font-weight:600;
  box-shadow:var(--sh-3);transition:all .28s cubic-bezier(.2,.9,.25,1);display:flex;align-items:center;gap:9px;
  max-width:calc(100% - 32px);}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.toast i{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none;}
.toast button{margin-left:6px;color:var(--brand-glow);font-weight:800;font-size:13px;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}
}
</style>
</head>

function nowM(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function mShift(mk,n){ var p=mk.split("-"),y=+p[0],m=+p[1]-1+n;
  y+=Math.floor(m/12); m=((m%12)+12)%12; return y+"-"+pad(m+1); }

var NF; try{ NF=new Intl.NumberFormat("en-US",{maximumFractionDigits:0}); }
catch(e){ NF={format:function(n){return String(n);}}; }

  if(Math.abs(n)>=100000) return "Rs "+(n/100000).toFixed(n%100000===0?0:1)+" lac";

function getP(o,p){ var a=p.split("."),v=o;

function avc(id){ var h=0,s=String(id||""); for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0;

function meterName(h,m){
  var base=m.prov||KINDS[m.kind].name;
  if(m.label) return base+" · "+m.label;
  var peers=(h.meters||[]).filter(function(x){
    return x.kind===m.kind && (x.prov||"")===(m.prov||"") && !x.label; });
  if(peers.length>1){
    var tail=m.ref ? String(m.ref).replace(/\s+/g,"").slice(-4) : "#"+(peers.indexOf(m)+1);
    return base+" · "+tail;
  }
  return base;
}
function itemsOf(h){
  var out=[];
  if(h.type!=="own") out.push({key:"rent", kind:"rent", name:"Rent", icon:"rent"});
  (h.meters||[]).forEach(function(m){
    out.push({key:m.id, kind:m.kind, name:meterName(h,m), icon:KINDS[m.kind].icon, meter:m});
  });
  return out;
}
function itemOf(h,key){ var a=itemsOf(h); for(var i=0;i<a.length;i++) if(a[i].key===key) return a[i]; return null; }

function peek(mk,hid){
  var src=(D.entries[mk]||{})[hid]||{}, out={};
  for(var k in src){
    if(!Object.prototype.hasOwnProperty.call(src,k)) continue;
    var it=src[k]||{};
    out[k]={amount:it.amount==null?"":it.amount, due:it.due||"", paid:!!it.paid,
            paidOn:it.paidOn||"", note:it.note||""};
  }
  return out;
}
function pick(rec,key){ return rec[key]||blank(); }
function ensure(mk,hid,key){
  if(!D.entries[mk]) D.entries[mk]={};
  if(!D.entries[mk][hid]) D.entries[mk][hid]={};
  var r=D.entries[mk][hid];
  if(!r[key]) r[key]=blank();
  return r[key];
}
function startMonth(h){
  var a=[];
  var sn=getP(h,"tenant.since"); if(sn && /^\d{4}-\d{2}/.test(sn)) a.push(sn.slice(0,7));
  if(+h.added>1e11){ var d=new Date(+h.added); a.push(d.getFullYear()+"-"+pad(d.getMonth()+1)); }
  return a.sort().pop()||"";
}
function amtOf(h,item,it,mk){
  if(it.amount!=="" && it.amount!=null) return +it.amount||0;
  if(item.key==="rent"){ if(mk && mk<startMonth(h)) return 0; return +getP(h,"tenant.rent")||0; }
  return 0;
}
function dueOf(h,item,it,mk){
  if(item.key==="rent") return mk+"-"+pad(Math.min(28,Math.max(1,+h.rentDay||5)));
  return it.due||"";
}
function statOf(h,item,it,mk){
  if(it.paid) return "paid";
  if(!amtOf(h,item,it,mk)) return "none";
  var d=dueOf(h,item,it,mk);
  return (d && today()>d) ? "late" : "due";
}
function houseMonth(h,mk){
  var e=peek(mk,h.id), r={owed:0,done:0,late:0,lateAmt:0,nItems:0,nPaid:0,rows:[]};
  itemsOf(h).forEach(function(item){
    var it=pick(e,item.key), s=statOf(h,item,it,mk), a=amtOf(h,item,it,mk);
    r.rows.push({item:item,it:it,s:s,a:a,d:dueOf(h,item,it,mk)});
    if(s!=="none") r.nItems++;
    if(s==="paid"){ r.done+=a; r.nPaid++; }
    else if(s==="due"||s==="late"){ r.owed+=a; if(s==="late"){ r.late++; r.lateAmt+=a; } }
  });
  return r;
}
function monthTotals(mk){
  var t={owed:0,done:0,nOwed:0,nDone:0,late:0,lateAmt:0,byKind:{rent:0,electric:0,gas:0,water:0}};
  D.houses.forEach(function(h){
    var r=houseMonth(h,mk);
    r.rows.forEach(function(x){
      if(x.s==="paid"){ t.done+=x.a; t.nDone++; }
      else if(x.s==="due"||x.s==="late"){ t.owed+=x.a; t.nOwed++; }
      if(x.s==="late"){ t.late++; t.lateAmt+=x.a; }
      if(x.s!=="none") t.byKind[x.item.kind]=(t.byKind[x.item.kind]||0)+x.a;
    });
  });
  t.total=t.owed+t.done;
  return t;
}

function fillTpl(tpl,h,amount,mk){

    .replace(/\{amount\}/g, rs(amount))
    .replace(/\{month\}/g, mName(mk))
    .replace(/\{property\}/g, h.name||"")
    .replace(/\{owner\}/g, SET().owner||"");
  return s.replace(/\s*[—-]\s*$/,"").replace(/\s{2,}/g," ").replace(/ ,/g,",").trim();
}

/* ═══════════════════ migration ═══════════════════ */
function migrate(d){
  if(!d || !d.houses) return d;
  if(!(d.v>=2)){
    var PMAP={"LESCO / MEPCO / GEPCO / FESCO / IESCO":"MEPCO","K-Electric":"K-Electric",
              "SNGPL":"SNGPL","SSGC":"SSGC","WASA / Water Board":"WASA"};
    var KMAP={bijli:"electric", gas:"gas", pani:"water"};
    var DEF={electric:"MEPCO", gas:"SNGPL", water:"WASA"};
    d.houses.forEach(function(h){
      if(h.meters) return;
      var u=h.utils||{}, ms=[];
      ["bijli","gas","pani"].forEach(function(old){
        var src=u[old]||{}, kind=KMAP[old];
        var m=newMeter(kind, PMAP[src.prov]||DEF[kind]);
        m.id="m_"+old+"_"+h.id; m.ref=src.ref||""; if(src.url) m.url=src.url;
        ms.push(m);
      });
      h.meters=ms; delete h.utils;
    });
    var ents=d.entries||{};
    Object.keys(ents).forEach(function(mk){
      var mo=ents[mk]||{};
      Object.keys(mo).forEach(function(hid){
        var rec=mo[hid]||{}, out={};
        if(rec.rent) out.rent=rec.rent;
        ["bijli","gas","pani"].forEach(function(old){ if(rec[old]) out["m_"+old+"_"+hid]=rec[old]; });
        mo[hid]=out;
      });
    });
  }
  var s=d.settings||{};
  for(var k in DEF_SETTINGS) if(s[k]==null) s[k]=DEF_SETTINGS[k];
  d.settings=s;
  d.houses.forEach(function(h,i){ if(!h.added) h.added=i+1; if(!h.meters) h.meters=[]; if(!h.tenant) h.tenant={}; });
  if(!d.entries) d.entries={};
  d.v=VERSION;
  return d;
}

function toast(m,undo){
  if(!tEl){ tEl=document.createElement("div"); tEl.className="toast"; tEl.setAttribute("role","status");
    document.body.appendChild(tEl);
    tEl.addEventListener("click",function(e){ if(e.target.closest("[data-undo]") && tUndo){ var f=tUndo; tUndo=null; f(); tEl.classList.remove("on"); } }); }
  tUndo=undo||null;

  tEl.style.pointerEvents=undo?"auto":"none";
  requestAnimationFrame(function(){ tEl.classList.add("on"); });
  clearTimeout(tT);

}
function copy(txt,lab){

  function fb(){
    try{ var t=document.createElement("textarea"); t.value=txt;
      t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t);
      t.select(); document.execCommand("copy"); document.body.removeChild(t); ok();
    }catch(e){ toast("Could not copy"); }
  }
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok,fb); return; } }catch(e){}
  fb();
}
function download(name,text,type){

    var b=new Blob([text],{type:type||"text/plain"}), u=URL.createObjectURL(b), a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },400);

function rowHTML(h,x,mk){
  var it=x.it, s=x.s, a=x.a, d=x.d;

      '<span class="'+PILL[s]+'">'+ST[s]+'</span></span>'+
    '<button class="tick'+(it.paid?" on":"")+'" data-tick="'+h.id+'|'+x.item.key+'" role="checkbox" '+
      'aria-checked="'+(it.paid?"true":"false")+'" aria-label="Mark '+esc(x.item.name)+' as paid">'+sv(IC.tick,15,3)+'</button>'+

}

function houseCard(h,mk,filter){
  var r=houseMonth(h,mk);
  var rows=r.rows.filter(function(x){ return rowPass(x.s,filter); });
  if(filter!=="all" && !rows.length) return "";
  var open=!!S.open[h.id];
  var pill = r.late ? '<span class="pill late">'+esc(rs(r.owed))+'</span>'
           : r.owed ? '<span class="pill due">'+esc(rs(r.owed))+'</span>'
           : r.nItems ? '<span class="pill ok">Settled</span>'
           : '<span class="pill none">No entries</span>';
  var who = h.type==="own" ? 'Own home'+(h.addr?' · '+esc(h.addr):'')
          : '<strong>'+esc(getP(h,"tenant.name")||"No tenant")+'</strong> · '+esc(rs(getP(h,"tenant.rent")))+'/mo';
  var pct = r.nItems ? Math.round(r.nPaid/r.nItems*100) : 0;
  var o='<article class="card">'+
    '<button class="phead" data-detail="'+h.id+'">'+
      '<span class="av '+avc(h.id)+'">'+esc(initials(h.name))+'</span>'+
      '<span class="pinfo"><b>'+esc(h.name)+'</b><span>'+who+'</span></span>'+pill+'</button>'+
    (r.nItems?'<div class="pmeter"><div class="bar"><i style="width:'+pct+'%"></i></div><span>'+r.nPaid+'/'+r.nItems+' paid</span></div>':'')+
    '<div class="items">'+rows.map(function(x){ return rowHTML(h,x,mk); }).join("")+'</div>';
  if(open){
    o+='<div class="refs">';
    if(!(h.meters||[]).length) o+='<div class="ref"><span class="rl"><b class="no">No meters added yet</b></span></div>';
    (h.meters||[]).forEach(function(m){
      o+='<div class="ref"><span class="rl"><small>'+esc(meterName(h,m))+'</small>'+
        (m.ref?'<b>'+esc(m.ref)+'</b>':'<b class="no">Reference number not set</b>')+'</span>'+
        (m.ref?'<button class="mini" data-copy="'+esc(m.ref)+'">'+sv(IC.copy,13,2.2)+'Copy</button>':'')+
        (m.url?'<a class="mini" href="'+esc(m.url)+'" target="_blank" rel="noopener noreferrer">'+sv(IC.ext,13,2.2)+'Bill</a>':'')+
      '</div>';
    });
    o+='</div>';
  }
  var rent=pick(peek(mk,h.id),"rent"), phone=getP(h,"tenant.phone");
  var rentAmt=amtOf(h,{key:"rent"},rent,mk);
  o+='<div class="acts">'+
    '<button class="act" data-toggle="'+h.id+'">'+sv(IC.card,15,2)+(open?'Hide refs':'Refs')+'</button>'+
    (h.type!=="own" && phone && rentAmt && !rent.paid ?'<button class="act wa" data-remind="'+h.id+'">'+sv(IC.wa,15,2)+'Remind</button>':'')+
    (h.type!=="own" && phone && rent.paid ?'<button class="act wa" data-receipt="'+h.id+'">'+sv(IC.receipt,15,2)+'Receipt</button>':'')+
    (phone?'<a class="act" href="tel:'+esc(phone)+'">'+sv(IC.phone,15,2)+'Call</a>':'')+
    '<button class="act sp ic" data-detail="'+h.id+'" aria-label="Edit property">'+sv(IC.edit,16,2)+'</button>'+
  '</div></article>';
  return o;
}

function vHome(){
  var o=vHero();

  var mk=S.month, t=monthTotals(mk);

  if(D.demo){

/* ═══════════════════ views: reports ═══════════════════ */
function vReports(){
  var o='<div class="topbar"><div class="grow"><h1>Reports</h1><div class="tsub">Last 12 months at a glance</div></div>'+
    '<button class="iconbtn" data-act="csv" aria-label="Export CSV">'+sv(IC.dl,19,2.2)+'</button></div>';
  if(!D.houses.length) return o+vEmpty();
  var months=[],i; for(i=11;i>=0;i--) months.push(mShift(nowM(),-i));
  var tots=months.map(monthTotals), col=0, all=0, max=1;
  tots.forEach(function(t){ col+=t.done; all+=t.total; if(t.total>max) max=t.total; });
  var cur=tots[11], rate= all?Math.round(col/all*100):0;

  o+='<div class="tiles">'+
    '<div class="tile dark"><span>Collected</span><b>'+esc(rsK(col))+'</b></div>'+
    '<div class="tile"><span>On-time rate</span><b class="g">'+rate+'%</b></div>'+
    '<div class="tile"><span>Due now</span><b style="color:'+(cur.owed?'var(--red)':'inherit')+'">'+esc(rsK(cur.owed))+'</b></div>'+
  '</div>';

  o+='<div class="card pad"><div class="sec" style="margin:0 0 4px"><h2>Monthly collection</h2><span class="cnt">'+esc(rsK(all))+' billed</span></div>'+
    '<div class="chart">'+months.map(function(m,ix){
      var t=tots[ix], h=Math.max(3,Math.round(t.total/max*100));
      var p=t.total?Math.round(t.done/t.total*100):0;
      return '<div class="col'+(ix===11?' cur':'')+'" title="'+esc(mName(m)+': '+rs(t.done)+' of '+rs(t.total))+'">'+
        '<div class="stk" style="height:'+h+'%"><i class="p" style="height:'+p+'%"></i><i class="o" style="height:'+(t.total?100-p:0)+'%"></i></div>'+
        '<span>'+MON[+m.split("-")[1]-1].charAt(0)+'</span></div>';
    }).join("")+'</div>'+
    '<div class="legend"><span><i style="background:var(--brand)"></i>Collected</span><span><i style="background:var(--amber)"></i>Not yet paid</span></div></div>';

  /* this month by type */
  var bk=cur.byKind, kt=bk.rent+bk.electric+bk.gas+bk.water;
  o+='<div class="card pad"><div class="sec" style="margin:0 0 10px"><h2>'+esc(mName(nowM()))+' by type</h2><span class="cnt">'+esc(rs(kt))+'</span></div>';
  [["rent","Rent"],["electric","Electricity"],["gas","Gas"],["water","Water"]].forEach(function(k){
    var v=bk[k[0]]||0, w=kt?Math.round(v/kt*100):0;
    o+='<div style="display:flex;align-items:center;gap:12px;padding:7px 0">'+
      '<span class="kic '+k[0]+'" style="width:34px;height:34px;border-radius:10px">'+sv(IC[kindIcon(k[0])],16,2)+'</span>'+
      '<span style="flex:1;min-width:0"><span style="display:flex;justify-content:space-between;font-size:13px;font-weight:600"><span>'+k[1]+'</span><span class="n">'+esc(rs(v))+'</span></span>'+
      '<span style="display:block;height:6px;border-radius:99px;background:var(--surface-3);margin-top:6px;overflow:hidden"><i style="display:block;height:100%;width:'+w+'%;border-radius:99px;background:var(--'+(k[0]==="rent"?"brand":k[0]==="electric"?"amber":k[0]==="gas"?"orange":"blue")+')"></i></span></span></div>';
  });
  o+='</div>';

  /* heatmap */
  o+='<div class="card pad"><div class="sec" style="margin:0 0 10px"><h2>Payment record</h2><span class="cnt">by property</span></div>'+
    '<div class="hmhead"><span class="sp"></span><span class="ms">'+months.map(function(m){
      return '<span>'+MON[+m.split("-")[1]-1].charAt(0)+'</span>'; }).join("")+'</span></div>';
  sortedHouses().forEach(function(h){
    var full=0, seen=0, cells="";
    months.forEach(function(m){
      var r=houseMonth(h,m), tot=r.nItems, ok=r.nPaid;
      var cls = tot===0?"":ok===tot?"all":ok===0?"nil":"some";
      if(tot){ seen++; if(ok===tot) full++; }
      cells+='<i class="'+cls+'" title="'+esc(mName(m)+": "+(tot?ok+" of "+tot+" paid":"no record"))+'"></i>';
    });
    o+='<div class="hm"><span class="hn"><b>'+esc(h.name)+'</b><span>'+(seen?full+'/'+seen+' months':'No record')+'</span></span>'+
      '<span class="cells">'+cells+'</span></div>';
  });
  o+='<div class="legend"><span><i style="background:var(--brand)"></i>All paid</span><span><i style="background:var(--amber)"></i>Partly</span>'+
    '<span><i style="background:var(--red)"></i>Unpaid</span><span><i style="background:var(--surface-3)"></i>No record</span></div></div>';

  o+='<button class="btn btn-dark" data-act="csv">'+sv(IC.file,18,2)+'Export all records (CSV)</button>';
  return o;
}

  if(ex){ ex.innerHTML='<div class="grab"></div>'+html; ex.scrollTop=0; return; }

function saveItem(hid,key){
  var it=ensure(S.month,hid,key);
  function gv(id){ var e=document.getElementById(id); return e?e.value:""; }

  it.amount = a==="" ? "" : (+a||0);

function readField(key,target){
  var el=document.getElementById("fv");
  if(!el) return true;
  var v=el.value.trim();
  if(key.indexOf("meter:")===0){
    var m=target.meters[+key.slice(6)];

    if(sel && sel.value){ var p=provOf(m.kind,sel.value); m.prov=p.n; m.url=p.u; }
    return true;
  }
  var d=F[key];
  if(d.req && !v){ toast("This one is required"); el.focus(); return false; }
  if(d.t==="money") v = v===""?"":(+v||0);

function wizSteps(){
  var base=["type","name","tenant.name","tenant.phone","tenant.rent","rentDay"]
    .filter(function(k){ return !(F[k].rentOnly && W.draft.type==="own"); });
  W.draft.meters.forEach(function(m,i){ base.push("meter:"+i); });
  return base;
}
function wizOpen(){ W={draft:emptyHouse(), i:0}; wizDraw(); }
function wizDraw(){
  var steps=wizSteps(), key=steps[W.i], d=fieldQ(key,W.draft), segs="";
  for(var i=0;i<steps.length;i++) segs+='<i class="'+(i<=W.i?'on':'')+'"></i>';
  openSheet(
    '<div class="wprog">'+segs+'</div>'+
    '<div class="eyb">New property · Step '+(W.i+1)+' of '+steps.length+'</div>'+
    '<h3>'+esc(d.q)+'</h3>'+
    '<p class="ssub">'+esc(d.s||"Skip anything you do not know yet.")+'</p>'+
    fieldHTML(key,getP(W.draft,key),W.draft,"wiz")+
    (d.t==="choice" ? '' :
      '<div class="brow">'+
      '<button class="btn btn-ghost" data-wiz="back"'+(W.i===0?' disabled':'')+'>Back</button>'+
      '<button class="btn btn-primary" data-wiz="next">'+(W.i===steps.length-1?"Finish":"Continue")+'</button></div>'+
      (d.req?'':'<button class="skip" data-wiz="skip">Skip for now</button>')),
    true
  );
  focusField();
}
function wizGo(dir){
  var steps=wizSteps(), key=steps[W.i];
  if(dir==="back"){ if(W.i>0){ W.i--; wizDraw(); } return; }
  if(dir==="next" && !readField(key,W.draft)) return;
  if(W.i < wizSteps().length-1){ W.i++; wizDraw(); return; }
  var h=W.draft;
  if(!h.name){ toast("The property needs a name"); return; }
  if(h.type==="own") h.tenant={name:"",phone:"",rent:0,deposit:"",since:""};
  h.added=Date.now();
  D.houses.push(h); save(); closeSheet(); go("home");
  toast(h.name+" added");
}

  meterRead();
  var h=houseById(MS.hid); if(!h) return;
  if(!h.meters) h.meters=[];

    var m=meterById(h,MS.mid);

  }else{
    var nm=newMeter(d.kind,d.prov); nm.url=d.url; nm.ref=d.ref; nm.label=d.label; h.meters.push(nm);

  },true);
}

    }).join("")+'</div>');

function restoreSheet(){
  openSheet('<div class="eyb">Backup</div><h3>Restore a backup</h3>'+

    '<label class="btn btn-ghost" style="cursor:pointer">'+sv(IC.file,18,2)+'Choose backup file<input type="file" id="bf" accept=".json,.txt,application/json,text/plain" hidden></label>'+

    '<div class="brow"><button class="btn btn-ghost" data-close="1">Cancel</button><button class="btn btn-primary" data-act="restoretext">Restore</button></div>');
  var bf=document.getElementById("bf");
  bf.addEventListener("change",function(){
    var f=bf.files&&bf.files[0]; if(!f) return;
    var r=new FileReader(); r.onload=function(){ doRestore(String(r.result||"")); }; r.readAsText(f);
  });

function doRestore(raw){
  raw=String(raw||"").trim();
  if(!raw){ toast("Paste the backup text first"); return; }
  var pj; try{ pj=JSON.parse(raw); }catch(err){ toast("That is not a valid backup"); return; }
  if(!pj || !pj.houses){ toast("No property data found in that backup"); return; }
  confirmSheet("Restore this backup?","It holds "+plural(pj.houses.length,"property","properties")+". Everything currently in the app will be replaced.","Restore",function(){
    D=migrate({v:pj.v||1, houses:pj.houses||[], entries:pj.entries||{}, demo:!!pj.demo, settings:pj.settings||D.settings});
    save(); closeSheet(); go("home"); toast("Backup restored");
  });
}
function csvExport(){
  var rows=[["Month","Property","Tenant","Item","Reference","Amount","Status","Due date","Paid on","Note"]];
  var months=Object.keys(D.entries).sort();
  months.forEach(function(mk){
    D.houses.forEach(function(h){
      houseMonth(h,mk).rows.forEach(function(x){
        if(x.s==="none" && !x.it.note) return;
        rows.push([mName(mk),h.name,getP(h,"tenant.name"),x.item.name,x.item.meter?x.item.meter.ref:"",x.a,ST[x.s],
          x.d||"",x.it.paidOn||"",x.it.note||""]);
      });
    });
  });
  var csv=rows.map(function(r){ return r.map(function(c){ c=String(c==null?"":c);
    return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(","); }).join("\r\n");
  download("kiraya-records-"+today()+".csv","﻿"+csv,"text/csv");
}

/* ═══════════════════ events ═══════════════════ */
document.addEventListener("input",function(e){
  if(e.target.id==="q"){ S.q=e.target.value; var pl=document.getElementById("plist"); if(pl) pl.innerHTML=propList(); }
});
document.addEventListener("change",function(e){
  if(e.target.id==="fp"){ var b=document.getElementById("pbx"); if(b){ b.classList.toggle("on",e.target.checked);
    b.querySelector(".tick").classList.toggle("on",e.target.checked); } }
  if(e.target.id==="m-prov" && MS){ var p=provOf(MS.d.kind,e.target.value); var u=document.getElementById("m-url"); if(u) u.value=p.u; }
});

document.addEventListener("click",function(e){
  var t=e.target,n;
  if((n=t.closest("[data-tab]"))){ go(n.getAttribute("data-tab")); return; }
  if((n=t.closest("[data-mv]"))){
    var dv=+n.getAttribute("data-mv");
    S.month = dv===0 ? nowM() : mShift(S.month,dv);
    render(); return;
  }
  if((n=t.closest("[data-filter]"))){ S.filter=n.getAttribute("data-filter"); render(); return; }
  if((n=t.closest("[data-ptype]"))){ S.ptype=n.getAttribute("data-ptype"); render(); return; }
  if((n=t.closest("[data-tick]"))){
    e.preventDefault(); e.stopPropagation();
    var p=n.getAttribute("data-tick").split("|"), h=houseById(p[0]);
    var it=ensure(S.month,p[0],p[1]), before=JSON.parse(JSON.stringify(it)), mk=S.month;
    it.paid=!it.paid;
    if(it.paid){
      if((it.amount===""||it.amount==null) && p[1]==="rent" && h) it.amount=getP(h,"tenant.rent")||"";
      it.paidOn=it.paidOn||today();
    } else it.paidOn="";
    save(); render();
    var nb=document.querySelector('[data-tick="'+p[0]+'|'+p[1]+'"]'); if(nb) nb.classList.add("pop");
    var itm=h?itemOf(h,p[1]):null;
    toast((itm?itm.name:"Item")+(it.paid?" marked paid":" marked unpaid"),function(){
      var cur=ensure(mk,p[0],p[1]); for(var k in before) cur[k]=before[k]; save(); render();
    });
    return;
  }
  if((n=t.closest("[data-qa]"))){ var fa=document.getElementById("fa"); if(fa) fa.value=n.getAttribute("data-qa"); return; }
  if((n=t.closest("[data-qd]"))){ var fv=document.getElementById("fv")||document.getElementById("sv"); if(fv) fv.value=n.getAttribute("data-qd"); return; }
  if((n=t.closest("[data-item]"))){ var q=n.getAttribute("data-item").split("|"); itemSheet(q[0],q[1]); return; }
  if((n=t.closest("[data-toggle]"))){ var id=n.getAttribute("data-toggle"); S.open[id]=!S.open[id]; render(); return; }
  if((n=t.closest("[data-copy]"))){ copy(n.getAttribute("data-copy"),"Reference number"); return; }
  if((n=t.closest("[data-edit]"))){ var w=n.getAttribute("data-edit").split("|"); editSheet(w[0],w[1]); return; }
  if((n=t.closest("[data-meter]"))){ var y=n.getAttribute("data-meter").split("|"); meterSheet(y[0],y[1]); return; }
  if((n=t.closest("[data-detail]"))){ detailSheet(n.getAttribute("data-detail")); return; }
  if((n=t.closest("[data-mkind]"))){
    if(!MS) return;
    meterRead();
    var k=n.getAttribute("data-mkind");
    if(k!==MS.d.kind){ MS.d.kind=k; var pp=k==="electric"?provOf(k,SET().defElec):KINDS[k].providers[0]; MS.d.prov=pp.n; MS.d.url=pp.u; }
    meterDraw(); return;
  }
  if(t.closest("[data-savemeter]")){ meterSave(); return; }
  if(t.closest("[data-delmeter]")){ meterDelete(); return; }
  if((n=t.closest("[data-back]"))){ detailSheet(n.getAttribute("data-back")); return; }
  if((n=t.closest("[data-saveitem]"))){ var v=n.getAttribute("data-saveitem").split("|"); saveItem(v[0],v[1]); return; }
  if(t.closest("[data-confirm]")){ var f=CF; CF=null; if(f) f(); else closeSheet(); return; }
  if((n=t.closest("[data-sort]"))){ D.settings.sort=n.getAttribute("data-sort"); save(); closeSheet(); render(); toast("Sorted by "+SORTS[D.settings.sort].toLowerCase()); return; }
  if((n=t.closest("[data-theme-set]"))){ D.settings.theme=n.getAttribute("data-theme-set"); save(); render(); return; }
  if((n=t.closest("[data-set]"))){ setSheet(n.getAttribute("data-set")); return; }
  if((n=t.closest("[data-tplreset]"))){ var tk=n.getAttribute("data-tplreset"); var ta=document.getElementById("sv"); if(ta) ta.value=DEF_SETTINGS[tk]; return; }
  if((n=t.closest("[data-saveset]"))){
    var sk=n.getAttribute("data-saveset"), el=document.getElementById("sv"), val=el?el.value:"";
    if(SETF[sk].ty==="day") val=Math.min(28,Math.max(1,+val||5));
    else if(SETF[sk].ty!=="tpl") val=String(val).trim();
    if(sk==="title" && !val) val=DEF_SETTINGS.title;
    D.settings[sk]=val; save(); closeSheet(); render(); toast("Saved"); return;
  }

  if((n=t.closest("[data-pick]"))){
    var pv=n.getAttribute("data-pick"), pk=n.closest("[data-pickfor]");
    var host=pk?pk.getAttribute("data-pickfor"):"wiz";
    if(host==="wiz"){ if(W){ W.draft.type=pv; W.i++; wizDraw(); } return; }
    var eh=houseById(host);
    if(eh){ eh.type=pv; if(pv==="own") eh.tenant={name:"",phone:"",rent:0,deposit:"",since:""};
      save(); render(); detailSheet(host); toast("Saved"); }
    return;
  }
  if((n=t.closest("[data-wiz]"))){
    var a=n.getAttribute("data-wiz");
    if(a==="skip"){ if(W.i<wizSteps().length-1){ W.i++; wizDraw(); } else wizGo("finish"); return; }
    wizGo(a); return;
  }
  if((n=t.closest("[data-savefield]"))){
    var z=n.getAttribute("data-savefield").split("|"), hh=houseById(z[0]);
    if(!hh) return;
    if(!readField(z[1],hh)) return;
    if(hh.type==="own") hh.tenant={name:"",phone:"",rent:0,deposit:"",since:""};
    save(); render(); detailSheet(z[0]); toast("Saved"); return;
  }
  if((n=t.closest("[data-del]"))){
    var did=n.getAttribute("data-del"), tg=houseById(did);
    confirmSheet("Delete this property?",'"'+(tg?tg.name:"")+'" and its complete payment history will be removed. This cannot be undone.',"Delete",function(){
      D.houses=D.houses.filter(function(x){ return x.id!==did; });
      Object.keys(D.entries).forEach(function(m){ if(D.entries[m]) delete D.entries[m][did]; });
      save(); closeSheet(); render(); toast("Property deleted");
    },true);
    return;
  }
  if((n=t.closest("[data-remind]")) || (n=t.closest("[data-receipt]"))){
    var isR=n.hasAttribute("data-receipt");
    var rh=houseById(n.getAttribute(isR?"data-receipt":"data-remind")); if(!rh) return;
    var amount=amtOf(rh,{key:"rent"},pick(peek(S.month,rh.id),"rent"),S.month);
    var msg=fillTpl(isR?SET().tplReceipt:SET().tplRemind, rh, amount, S.month);
    window.open("https://wa.me/"+waNum(getP(rh,"tenant.phone"))+"?text="+encodeURIComponent(msg),"_blank","noopener");
    return;
  }

  if((n=t.closest("[data-act]"))){
    var act=n.getAttribute("data-act");
    if(act==="newhouse"){ wizOpen(); return; }
    if(act==="sort"){ sortSheet(); return; }
    if(act==="theme"){ D.settings.theme=isDark()?"light":"dark"; save(); render(); return; }
    if(act==="install"){
      var dp=INSTALL.p; if(!dp) return;
      INSTALL.p=null; render(); dp.prompt();
      if(dp.userChoice) dp.userChoice.then(function(c){ toast(c && c.outcome==="accepted" ? "Installing" : "Maybe later"); });
      return;
    }
    if(act==="cleardemo"){
      confirmSheet("Clear sample data?","All example properties and bills are removed so you can start with your own.","Clear",function(){
        D={v:VERSION, houses:[], entries:{}, demo:false, settings:D.settings}; save(); closeSheet(); go("home");
        toast("Ready — add your first property");
      });
      return;
    }
    if(act==="loaddemo"){
      confirmSheet("Load sample data?","Your current properties and history will be replaced with examples. Take a backup first if needed.","Load samples",function(){
        D=seed(D.settings); save(); closeSheet(); go("home"); toast("Sample data loaded");
      },true);
      return;
    }
    if(act==="copybk"){ copy(JSON.stringify(D),"Backup"); return; }
    if(act==="bkfile"){ download("kiraya-backup-"+today()+".json",JSON.stringify(D),"application/json"); return; }
    if(act==="csv"){ csvExport(); return; }
    if(act==="restore"){ restoreSheet(); return; }
    if(act==="restoretext"){ var bi=document.getElementById("bi"); doRestore(bi?bi.value:""); return; }
    if(act==="wipe"){
      confirmSheet("Erase everything?","Every property, every bill and the full history will be removed for good. Download a backup first.","Erase all",function(){
        D={v:VERSION, houses:[], entries:{}, demo:false, settings:D.settings}; save(); closeSheet(); go("home");
        toast("Register erased");
      },true);
      return;
    }
  }
  if(t.closest("[data-close]") || t.getAttribute("data-bg")==="1"){ closeSheet(); return; }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape") closeSheet();
  if(e.key==="Enter" && e.target && e.target.id==="fv"){ var nx=document.querySelector('[data-wiz="next"],[data-savefield]'); if(nx){ e.preventDefault(); nx.click(); } }
});

/* ═══════════ PWA: service worker + install ═══════════ */
(function pwa(){
  var head=document.head; if(!head) return;
  var hosted = /^https?:$/.test(location.protocol);
  if(hosted && navigator.serviceWorker){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        if(reg && reg.update) reg.update();
      }).catch(function(){});
    });
  }
})();

window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); INSTALL.p=e; render(); });
window.addEventListener("appinstalled", function(){ INSTALL.p=null; render(); toast("Installed — find the icon on your home screen"); });

render();
})();
