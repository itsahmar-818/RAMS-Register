<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Rent, electricity, gas and water bills for every property in one place.">
<meta name="theme-color" content="#f5ead8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kiraya Register">
<meta name="application-name" content="Kiraya Register">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kiraya Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   Organic design system — same tokens as RAMS Electric
   ═══════════════════════════════════════════════════════════ */
:root{
  --color-bg:#f5ead8;
  --color-surface:#ebddc5;
  --color-text:#201e1d;
  --color-accent:#c67139;
  --color-accent-2:#7a8a5e;
  --color-divider:color-mix(in srgb,#201e1d 16%,transparent);

  --color-neutral-100:#f9f4ed; --color-neutral-200:#eee7db; --color-neutral-300:#dcd3c4;
  --color-neutral-400:#c0b6a5; --color-neutral-500:#a19786; --color-neutral-600:#82796a;
  --color-neutral-700:#645c50; --color-neutral-800:#474238; --color-neutral-900:#2e2b25;

  --color-accent-100:#fff2eb; --color-accent-200:#ffe1d0; --color-accent-300:#ffc6a5;
  --color-accent-400:#f6a06b; --color-accent-500:#d67f48; --color-accent-600:#b2622d;
  --color-accent-700:#8c491a; --color-accent-800:#643312; --color-accent-900:#402310;

  --color-accent-2-100:#f0fae1; --color-accent-2-200:#e1eecc; --color-accent-2-300:#ccdbb2;
  --color-accent-2-400:#aebf92; --color-accent-2-500:#8fa073; --color-accent-2-600:#728157;
  --color-accent-2-700:#56633f; --color-accent-2-800:#3d472b; --color-accent-2-900:#272e1b;

  --color-alert:#b8402a; --color-alert-100:#ffe3db; --color-alert-700:#8a2a17;

  --font-heading:"Caprasimo",Georgia,system-ui,serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;

  --space-1:4.4px; --space-2:8.8px; --space-3:13.2px;
  --space-4:17.6px; --space-6:26.4px; --space-8:35.2px;

  --radius-sm:8px; --radius-md:16px; --radius-lg:28px;

  --shadow-sm:0 1px 2px color-mix(in srgb,#2e2b25 14%,transparent);
  --shadow-md:0 3px 10px color-mix(in srgb,#2e2b25 16%,transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb,#2e2b25 22%,transparent);

  --bar-h:66px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --color-bg:#191614; --color-surface:#241f1c; --color-text:#f4ebdd;
    --color-divider:color-mix(in srgb,#f4ebdd 18%,transparent);
    --color-neutral-100:#211d1a; --color-neutral-200:#2b2622; --color-neutral-300:#3b342d;
    --color-neutral-400:#544c42; --color-neutral-500:#7d7365; --color-neutral-600:#a89c8a;
    --color-neutral-700:#c8bcaa; --color-neutral-800:#e0d5c3; --color-neutral-900:#f4ebdd;
    --color-accent:#d9834b;
    --color-accent-100:#33231a; --color-accent-200:#432d20; --color-accent-300:#5c3d29;
    --color-accent-400:#8a5a33; --color-accent-500:#b5743f; --color-accent-600:#d0894f;
    --color-accent-700:#eba86f; --color-accent-800:#f6c79b; --color-accent-900:#fde3c8;
    --color-accent-2:#8fa073;
    --color-accent-2-100:#22271b; --color-accent-2-200:#2e3524; --color-accent-2-300:#3f4931;
    --color-accent-2-400:#5b6a45; --color-accent-2-500:#788a5c; --color-accent-2-600:#93a678;
    --color-accent-2-700:#b3c496; --color-accent-2-800:#cfdcb6; --color-accent-2-900:#e6efd6;
    --color-alert:#e8674a; --color-alert-100:#3a1d16; --color-alert-700:#ff9e86;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    --shadow-md:0 3px 10px rgba(0,0,0,.55);
    --shadow-lg:0 12px 32px rgba(0,0,0,.62);
  }
  :root:not([data-theme="light"]) input,
  :root:not([data-theme="light"]) textarea{color-scheme:dark;}
}
:root[data-theme="dark"]{
  --color-bg:#191614; --color-surface:#241f1c; --color-text:#f4ebdd;
  --color-divider:color-mix(in srgb,#f4ebdd 18%,transparent);
  --color-neutral-100:#211d1a; --color-neutral-200:#2b2622; --color-neutral-300:#3b342d;
  --color-neutral-400:#544c42; --color-neutral-500:#7d7365; --color-neutral-600:#a89c8a;
  --color-neutral-700:#c8bcaa; --color-neutral-800:#e0d5c3; --color-neutral-900:#f4ebdd;
  --color-accent:#d9834b;
  --color-accent-100:#33231a; --color-accent-200:#432d20; --color-accent-300:#5c3d29;
  --color-accent-400:#8a5a33; --color-accent-500:#b5743f; --color-accent-600:#d0894f;
  --color-accent-700:#eba86f; --color-accent-800:#f6c79b; --color-accent-900:#fde3c8;
  --color-accent-2:#8fa073;
  --color-accent-2-100:#22271b; --color-accent-2-200:#2e3524; --color-accent-2-300:#3f4931;
  --color-accent-2-400:#5b6a45; --color-accent-2-500:#788a5c; --color-accent-2-600:#93a678;
  --color-accent-2-700:#b3c496; --color-accent-2-800:#cfdcb6; --color-accent-2-900:#e6efd6;
  --color-alert:#e8674a; --color-alert-100:#3a1d16; --color-alert-700:#ff9e86;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow-md:0 3px 10px rgba(0,0,0,.55);
  --shadow-lg:0 12px 32px rgba(0,0,0,.62);
}
:root[data-theme="dark"] input,
:root[data-theme="dark"] textarea{color-scheme:dark;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #shell::before{
    background:color-mix(in srgb,var(--color-accent) 7%,transparent);}
  :root:not([data-theme="light"]) #shell::after{
    background:color-mix(in srgb,var(--color-accent-2) 7%,transparent);}
}
:root[data-theme="dark"] #shell::before{background:color-mix(in srgb,var(--color-accent) 7%,transparent);}
:root[data-theme="dark"] #shell::after{background:color-mix(in srgb,var(--color-accent-2) 7%,transparent);}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
button,.tag,.eyebrow,.htop,.hwho,.foot,.tab,.chip,.brand,.score,.plegend{
  -webkit-user-select:none;user-select:none;}
button,a,input,select,textarea,.hrow{touch-action:manipulation;}
body{
  margin:0;background:var(--color-bg);color:var(--color-text);
  font-family:var(--font-body);font-size:15px;line-height:1.55;font-weight:400;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none;
}
h1,h2,h3{font-family:var(--font-heading);font-weight:400;line-height:1.12;
  letter-spacing:-.015em;margin:0 0 var(--space-2);}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;
  -webkit-appearance:none;appearance:none;border:none;background:none;}
button{cursor:pointer;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent);}
.n{font-variant-numeric:tabular-nums;}

/* ─── shell ─────────────────────────────────────────────── */
#shell{max-width:440px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh;}
#shell::before{content:'';position:fixed;top:-90px;right:-70px;width:260px;height:260px;
  border-radius:50%;background:color-mix(in srgb,var(--color-accent) 13%,transparent);
  pointer-events:none;z-index:0;}
#shell::after{content:'';position:fixed;top:130px;left:-95px;width:190px;height:190px;
  border-radius:50%;background:color-mix(in srgb,var(--color-accent-2) 14%,transparent);
  pointer-events:none;z-index:0;}

.appbar{position:sticky;top:0;z-index:50;
  padding:calc(var(--sat) + var(--space-3)) var(--space-4) var(--space-2);
  background:linear-gradient(to bottom,var(--color-bg) 74%,transparent);
  display:flex;align-items:center;gap:var(--space-3);}
.mark{width:38px;height:38px;border-radius:999px;flex:none;
  background:linear-gradient(140deg,var(--color-accent-400),var(--color-accent-700));
  display:grid;place-items:center;box-shadow:var(--shadow-sm);}
.brand{margin-right:auto;min-width:0;}
.brand .nn{font-family:var(--font-heading);font-size:19px;line-height:1;white-space:nowrap;}
.brand .s{font-size:10.5px;letter-spacing:.09em;color:var(--color-neutral-600);
  margin-top:3px;text-transform:uppercase;}
.chip{display:flex;align-items:center;gap:var(--space-2);background:var(--color-surface);
  border-radius:999px;padding:6px 13px 6px 7px;flex:none;}
.chip .cd{width:26px;height:26px;border-radius:999px;flex:none;display:grid;place-items:center;
  background:var(--color-accent-2);color:var(--color-bg);}
.chip.over .cd{background:var(--color-alert);}
.chip .t{line-height:1.2;}
.chip .t b{display:block;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
.chip .t span{font-size:9.5px;color:var(--color-neutral-600);}
.chip.over .t b{color:var(--color-alert);}

main{position:relative;z-index:1;
  padding:0 var(--space-4) calc(var(--bar-h) + var(--sab) + var(--space-6));}
.panel{animation:pin .32s cubic-bezier(.22,1,.36,1);}
@keyframes pin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--color-neutral-600);font-weight:700;margin:var(--space-4) var(--space-2) var(--space-2);}
.eyebrow.first{margin-top:var(--space-2);}

/* ─── card ──────────────────────────────────────────────── */
.card{display:flex;flex-direction:column;gap:var(--space-1);
  padding:var(--space-3) var(--space-4);
  border-radius:calc(var(--radius-lg) * 1.05);background:var(--color-surface);
  margin-bottom:var(--space-2);}
.card.flat{gap:0;}
.elev-sm{box-shadow:var(--shadow-sm);}

/* ─── tags ──────────────────────────────────────────────── */
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;
  padding:3px 11px;border-radius:999px;font-weight:600;white-space:nowrap;}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800);}
.tag-accent-2{background:var(--color-accent-2-100);color:var(--color-accent-2-800);}
.tag-alert{background:var(--color-alert-100);color:var(--color-alert-700);}
.tag-mute{background:color-mix(in srgb,var(--color-text) 7%,transparent);color:var(--color-neutral-600);}

/* ─── segmented ─────────────────────────────────────────── */
.seg{display:flex;border:1px solid var(--color-divider);border-radius:999px;
  overflow:hidden;margin:var(--space-1) 0 var(--space-2);}
.seg button{flex:1;padding:9px;font-size:13px;font-weight:600;}
.seg button + button{border-left:1px solid var(--color-divider);}
.seg button.on{color:var(--color-bg);}
.seg button.on.a{background:var(--color-accent);}

/* ─── hero ──────────────────────────────────────────────── */
.hero{background:linear-gradient(140deg,
      color-mix(in srgb,var(--color-accent) 22%,var(--color-surface)) 0%,
      var(--color-surface) 62%);gap:0;}
.hero .g{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;
  color:var(--color-accent-700);}
.hero .big{font-family:var(--font-heading);font-size:31px;line-height:1;margin-top:6px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.hero .big.ok{font-size:25px;color:var(--color-accent-2-800);}
.hero .meta{font-size:11.5px;color:var(--color-neutral-700);margin-top:5px;}
.hero .strip{display:flex;gap:var(--space-2);margin-top:var(--space-4);
  padding-top:var(--space-3);border-top:1px solid var(--color-divider);}
.hero .strip div{flex:1;}
.hero .strip .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--color-neutral-600);font-weight:700;}
.hero .strip .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}
.hero .strip .v.alert{color:var(--color-alert);}
.hero .strip .v.pos{color:var(--color-accent-2-800);}

.split{display:flex;height:9px;border-radius:999px;overflow:hidden;
  background:var(--color-neutral-300);margin:var(--space-3) 0 0;}
.split i{display:block;height:100%;}
.plegend{display:flex;gap:var(--space-3);flex-wrap:wrap;font-size:10.5px;
  color:var(--color-neutral-700);}
.plegend b{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:5px;}

/* ─── house head ────────────────────────────────────────── */
.htop{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-1);}
.htop .nm{font-family:var(--font-heading);font-size:17.5px;line-height:1.1;min-width:0;}
.htop .rr{margin-left:auto;flex:none;text-align:right;}
.hwho{font-size:11px;color:var(--color-neutral-700);margin-bottom:5px;}
.hwho b{font-weight:700;color:var(--color-text);}

/* ─── rows ──────────────────────────────────────────────── */
.hrow{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  padding:6px 0;
  border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);}
.hrow:last-of-type{border-bottom:none;}
.hrow.tap{margin:0 calc(var(--space-2) * -1);padding-left:var(--space-2);
  padding-right:var(--space-2);border-radius:var(--radius-md);}
.hrow.tap:active{background:color-mix(in srgb,var(--color-text) 8%,transparent);}
.si{width:32px;height:32px;border-radius:999px;flex:none;display:grid;place-items:center;
  background:var(--color-bg);color:var(--color-accent-700);transition:background .18s,color .18s;}
.si.done{background:var(--color-accent-2);color:var(--color-bg);}
.si:active{transform:scale(.92);}
.rmid{flex:1;min-width:0;}
.rmid b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;}
.rmid span{display:block;font-size:11px;color:var(--color-neutral-600);margin-top:1px;}
.rend{flex:none;display:flex;align-items:center;gap:7px;justify-content:flex-end;}
.rend .amt{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;}
.rend .amt.no{color:var(--color-neutral-500);font-weight:400;}
.chev{color:var(--color-neutral-500);flex:none;display:grid;place-items:center;}

/* ─── card footer pills ─────────────────────────────────── */
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--space-2);
  padding-top:var(--space-2);border-top:1px solid var(--color-divider);}
.pbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  border:1px solid var(--color-divider);border-radius:999px;padding:5px 11px;
  font-size:11px;font-weight:700;color:var(--color-neutral-700);}
.pbtn:active{background:var(--color-accent);color:var(--color-bg);border-color:var(--color-accent);}
.pbtn.hot{background:var(--color-accent-100);color:var(--color-accent-800);
  border-color:color-mix(in srgb,var(--color-accent) 40%,transparent);}

/* ─── reference list ────────────────────────────────────── */
.dl{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);
  padding:var(--space-2) 0;
  border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);font-size:13px;}
.dl:last-child{border-bottom:none;}
.dl .dt{color:var(--color-neutral-700);flex:none;font-size:12px;}
.dl .dd{margin:0;text-align:right;font-weight:600;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;}
.dl .dd.no{font-weight:400;color:var(--color-neutral-500);letter-spacing:0;}
.cpy{display:flex;align-items:center;gap:var(--space-2);justify-content:flex-end;min-width:0;}
.cpybtn{border:1px solid var(--color-divider);border-radius:999px;padding:3px 11px;
  font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--color-neutral-700);flex:none;}
.cpybtn:active{background:var(--color-accent);color:var(--color-bg);border-color:var(--color-accent);}

/* ─── record grid ───────────────────────────────────────── */
.mg{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:var(--space-3);}
.mg .c{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;}
.mg .c i{width:100%;height:30px;border-radius:var(--radius-sm);display:block;
  background:var(--color-neutral-300);}
.mg .c i.all{background:var(--color-accent-2);}
.mg .c i.some{background:var(--color-accent-400);}
.mg .c i.nil{background:var(--color-alert);}
.mg .c span{font-size:8.5px;color:var(--color-neutral-600);font-weight:700;}
.score{font-size:11.5px;color:var(--color-neutral-700);margin-top:var(--space-1);}
.score b{font-weight:700;color:var(--color-text);font-variant-numeric:tabular-nums;}

/* ─── insight strip ─────────────────────────────────────── */
.ins{display:flex;gap:var(--space-3);align-items:flex-start;
  padding:var(--space-2) var(--space-3);border-radius:var(--radius-lg);
  background:var(--color-surface);margin-bottom:var(--space-2);}
.ins .ic{width:30px;height:30px;border-radius:999px;flex:none;display:grid;place-items:center;
  background:var(--color-bg);}
.ins .tt{font-size:13px;font-weight:700;line-height:1.3;}
.ins .bb{font-size:11.5px;color:var(--color-neutral-700);margin-top:3px;line-height:1.5;}
.ins .bb button{color:var(--color-accent-700);font-weight:700;font-size:11.5px;
  text-decoration:underline;text-underline-offset:2px;margin-top:5px;}
.ins.warn{background:var(--color-accent-100);}
.ins.warn .ic{box-shadow:inset 0 0 0 1.5px var(--color-accent);}
.ins.warn .tt{color:var(--color-accent-800);}

.empty{text-align:center;padding:var(--space-8) var(--space-4);
  color:var(--color-neutral-600);font-size:13px;line-height:1.7;}
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:var(--space-8) var(--space-4) var(--space-6);gap:0;}
.welcome .orb{width:84px;height:84px;border-radius:999px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--color-accent-400),var(--color-accent-700));
  color:var(--color-bg);box-shadow:var(--shadow-md);margin-bottom:var(--space-4);}
.welcome h2{font-family:var(--font-heading);font-size:26px;line-height:1.15;margin:0;}
.welcome p{font-size:13px;color:var(--color-neutral-700);line-height:1.6;
  margin:var(--space-2) 0 var(--space-6);max-width:270px;}
.welcome .btn{max-width:280px;}
.steps{display:flex;flex-direction:column;gap:var(--space-3);width:100%;
  margin-top:var(--space-6);padding-top:var(--space-4);
  border-top:1px solid var(--color-divider);text-align:left;}
.steps div{display:flex;gap:var(--space-3);align-items:flex-start;}
.steps i{width:22px;height:22px;border-radius:999px;flex:none;display:grid;place-items:center;
  background:var(--color-bg);color:var(--color-accent-700);font-style:normal;
  font-size:11px;font-weight:800;}
.steps p{margin:0;font-size:12px;color:var(--color-neutral-700);line-height:1.5;max-width:none;}
.steps b{color:var(--color-text);font-weight:700;}
.foot{text-align:center;font-size:10.5px;color:var(--color-neutral-600);line-height:1.7;
  margin-top:var(--space-4);padding:0 var(--space-4);}

/* ─── buttons ───────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;
  font-family:var(--font-heading);font-weight:400;font-size:15px;line-height:1.2;
  padding:var(--space-3) calc(var(--space-3) * 1.2);border-radius:999px;
  border:1px solid transparent;width:100%;}
.btn-primary{background:var(--color-accent);color:var(--color-bg);}
.btn-primary:active{background:var(--color-accent-700);}
.btn-secondary{border-color:var(--color-divider);}
.btn-secondary:active{background:color-mix(in srgb,var(--color-text) 14%,transparent);}
.btn-alert{background:var(--color-alert-100);color:var(--color-alert-700);}
.btn + .btn{margin-top:var(--space-2);}
.btn[disabled]{opacity:.42;pointer-events:none;}
.brow{display:flex;gap:var(--space-2);}
.brow .btn{margin-top:0;}
.brow .btn:first-child{flex:0 0 38%;}
.brow .btn:last-child{flex:1;}

/* ─── FAB ───────────────────────────────────────────────── */
.fab{position:fixed;right:calc(50% - 220px + var(--space-4));
  bottom:calc(var(--bar-h) + var(--sab) + var(--space-4));z-index:60;
  width:58px;height:58px;border-radius:999px;display:grid;place-items:center;
  background:var(--color-accent);color:var(--color-bg);box-shadow:var(--shadow-lg);
  transition:transform .18s;}
.fab:active{transform:scale(.9);background:var(--color-accent-700);}
.fab[hidden]{display:none;}
@media(max-width:472px){.fab{right:var(--space-4);}}

/* ─── tab bar ───────────────────────────────────────────── */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);
  z-index:70;height:calc(var(--bar-h) + var(--sab));padding-bottom:var(--sab);
  background:color-mix(in srgb,var(--color-surface) 93%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:var(--shadow-md);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--color-neutral-600);transition:color .2s;}
.tab.on{color:var(--color-accent-700);}
.tab span{font-size:10px;font-weight:700;}

/* ─── sheet ─────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:80;
  background:color-mix(in srgb,var(--color-neutral-900) 50%,transparent);
  opacity:0;transition:opacity .28s;}
.scrim.on{opacity:1;}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(102%);
  width:min(440px,100%);z-index:90;background:var(--color-surface);
  border-radius:calc(var(--radius-lg) * 1.4) calc(var(--radius-lg) * 1.4) 0 0;
  padding:var(--space-2) var(--space-4) calc(var(--space-6) + var(--sab));
  transition:transform .36s cubic-bezier(.22,1,.36,1);box-shadow:var(--shadow-lg);
  max-height:88vh;overflow-y:auto;}
.sheet.on{transform:translateX(-50%) translateY(0);}
.grab{width:40px;height:4px;border-radius:999px;background:var(--color-neutral-400);
  margin:0 auto var(--space-4);}
.sheet h3{font-size:24px;margin-bottom:var(--space-1);}
.sheet .sub{font-size:13px;color:var(--color-neutral-700);margin-bottom:var(--space-6);}
.sheet .kk{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;
  color:var(--color-accent-700);margin-bottom:var(--space-2);}
.wprog{display:flex;height:6px;border-radius:999px;overflow:hidden;
  background:var(--color-neutral-300);margin-bottom:var(--space-4);}
.wprog i{display:block;height:100%;background:var(--color-accent);transition:width .3s;}
.skip{width:100%;text-align:center;font-size:12px;font-weight:600;
  color:var(--color-neutral-600);padding:var(--space-4) 0 0;}

/* ─── fields ────────────────────────────────────────────── */
.field{margin-bottom:var(--space-3);}
.field > label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:700;margin-bottom:6px;color:var(--color-neutral-700);}
.input{width:100%;min-height:46px;padding:10px 16px;font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--color-text);caret-color:var(--color-accent);
  background:var(--color-bg);border:1px solid var(--color-divider);border-radius:999px;}
.input::placeholder{font-weight:400;color:var(--color-neutral-500);}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0;}
.input.big{font-family:var(--font-heading);font-weight:400;font-size:27px;min-height:60px;
  padding:10px 20px;}
select.input{background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2382796a' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 16px center;background-size:16px;
  padding-right:44px;font-size:14px;}
textarea.input{border-radius:var(--radius-md);min-height:110px;font-size:12px;font-weight:400;
  resize:vertical;line-height:1.5;}
.hint{font-size:10.5px;color:var(--color-neutral-600);margin-top:5px;padding-left:14px;}
.swrow{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  background:var(--color-bg);border-radius:999px;padding:10px 8px 10px 18px;
  margin-bottom:var(--space-3);}
.swrow .lb{flex:1;font-size:14px;font-weight:700;}
.sw{position:relative;width:52px;height:31px;flex:none;}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2;}
.sw .tr{position:absolute;inset:0;border-radius:999px;background:var(--color-neutral-400);
  transition:background .2s;}
.sw .tr::after{content:'';position:absolute;top:3px;left:3px;width:25px;height:25px;
  border-radius:999px;background:var(--color-bg);transition:transform .2s;box-shadow:var(--shadow-sm);}
.sw input:checked + .tr{background:var(--color-accent-2);}
.sw input:checked + .tr::after{transform:translateX(21px);}
.more{width:100%;text-align:center;font-size:12px;font-weight:700;
  color:var(--color-accent-700);padding:var(--space-2) 0 var(--space-3);}

/* ─── settings rows ─────────────────────────────────────── */
.srow{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  padding:var(--space-3) 0;font-size:14px;
  border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);}
.srow:last-of-type{border-bottom:none;}
.srow .si2{width:32px;height:32px;border-radius:999px;flex:none;display:grid;place-items:center;
  background:var(--color-bg);color:var(--color-accent-700);}
.srow .st{flex:1;min-width:0;}
.srow .st b{display:block;font-weight:700;font-size:13.5px;}
.srow .st span{display:block;font-size:11.5px;color:var(--color-neutral-600);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.srow .st span.set{color:var(--color-text);font-weight:600;}
.srow:active{opacity:.6;}
.pick{display:flex;flex-direction:column;gap:var(--space-2);}
.pick button{text-align:left;padding:var(--space-4);border-radius:var(--radius-lg);
  background:var(--color-bg);border:1px solid var(--color-divider);}
.pick button:active{border-color:var(--color-accent);background:var(--color-accent-100);}
.pick b{display:block;font-family:var(--font-heading);font-size:17px;line-height:1.15;}
.pick span{display:block;font-size:11.5px;color:var(--color-neutral-700);margin-top:4px;}

/* ─── toast ─────────────────────────────────────────────── */
.toast{position:fixed;bottom:calc(var(--bar-h) + var(--sab) + var(--space-6));left:50%;
  transform:translateX(-50%) translateY(16px);z-index:100;background:var(--color-neutral-900);
  color:var(--color-neutral-100);border-radius:999px;padding:11px 22px;font-size:13px;
  font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  box-shadow:var(--shadow-lg);white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

/* ─── meters ────────────────────────────────────────────── */
.sechd{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;
  color:var(--color-accent-700);margin:var(--space-6) 0 var(--space-2);}
.addm{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  border:1px dashed color-mix(in srgb,var(--color-text) 26%,transparent);border-radius:999px;
  padding:11px;font-size:13px;font-weight:700;color:var(--color-neutral-700);
  margin-top:var(--space-3);}
.addm:active{border-color:var(--color-accent);color:var(--color-accent-700);
  background:var(--color-accent-100);}
.seg.three button{font-size:12.5px;}
.mtag{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  color:var(--color-neutral-600);}
.rmid .co{font-weight:700;}
.rmid .lbl{font-weight:400;color:var(--color-neutral-600);}
.dangerzone{margin-top:var(--space-4);padding-top:var(--space-4);
  border-top:1px solid var(--color-divider);}
</style>
</head>
<body>

<div id="shell">
  <header class="appbar">
    <div class="mark">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="var(--color-bg)"
           stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 21v-7H9v7"/><path d="M3 10.5 12 3l9 7.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </div>
    <div class="brand"><div class="nn">Kiraya Register</div><div class="s" id="bsub"></div></div>
    <div class="chip" id="chip"></div>
  </header>

  <main><section class="panel" id="app"></section></main>

  <button class="fab" id="fab" aria-label="Add a property" hidden>
    <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor"
         stroke-width="2.75" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>
  </button>

  <nav class="tabbar" id="tabs">
    <button class="tab on" data-tab="dash">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
           stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>
      <span>Month</span></button>
    <button class="tab" data-tab="props">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
           stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 21v-7H9v7"/><path d="M3 10.5 12 3l9 7.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Properties</span></button>
    <button class="tab" data-tab="history">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
           stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M8 17v-3M13 17V8M18 17v-6"/></svg>
      <span>History</span></button>
    <button class="tab" data-tab="backup">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
           stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span>Backup</span></button>
  </nav>
</div>

<div id="sheetroot"></div>

<script>
(function(){
"use strict";

/* ═══════════════════ constants ═══════════════════ */
var KEY="kiraya-register-v1";
var VERSION=2;
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var FULLMON=["January","February","March","April","May","June",
             "July","August","September","October","November","December"];
var ST={paid:"Paid", due:"Due", late:"Overdue", none:"Not set"};
var TAGC={paid:"tag-accent-2", due:"tag-accent", late:"tag-alert", none:"tag-mute"};

var PITC="https://bill.pitc.com.pk/";
var KINDS={
  electric:{
    name:"Electricity", icon:"bolt",
    q:"What is the electricity reference number?",
    hint:"The 14-digit reference number printed at the top of the bill.",
    ph:"14-digit reference number",
    providers:[{n:"MEPCO",u:PITC},{n:"LESCO",u:PITC},{n:"GEPCO",u:PITC},{n:"FESCO",u:PITC},
               {n:"IESCO",u:PITC},{n:"PESCO",u:PITC},{n:"HESCO",u:PITC},{n:"SEPCO",u:PITC},
               {n:"QESCO",u:PITC},{n:"TESCO",u:PITC},
               {n:"K-Electric",u:"https://www.ke.com.pk/"}]
  },
  gas:{
    name:"Gas", icon:"flame",
    q:"What is the gas consumer number?",
    hint:"The consumer number printed on the gas bill.",
    ph:"Consumer number",
    providers:[{n:"SNGPL",u:"https://www.sngpl.com.pk/"},
               {n:"SSGC",u:"https://www.ssgc.com.pk/"}]
  },
  water:{
    name:"Water", icon:"drop",
    q:"What is the water connection number?",
    hint:"The connection number on the water board receipt.",
    ph:"Connection number",
    providers:[{n:"WASA",u:""},{n:"Water Board",u:""}]
  }
};
var KIND_ORDER=["electric","gas","water"];

function sv(d,w,s){ return '<svg viewBox="0 0 24 24" width="'+(w||17)+'" height="'+(w||17)+'" '+
  'fill="none" stroke="currentColor" stroke-width="'+(s||2.5)+'" stroke-linecap="round" '+
  'stroke-linejoin="round">'+d+'</svg>'; }
var IC={
  rent:  '<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/>',
  bolt:  '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  flame: '<path d="M12 22c3.9 0 7-2.8 7-6.6 0-4.6-4-6.4-4-10.4-2 1-3 2.6-3 4.6-1-.7-1.6-1.8-1.8-3C8 8.4 5 10.4 5 15.4 5 19.2 8.1 22 12 22z"/>',
  drop:  '<path d="M12 3s6 6.4 6 10.4A6 6 0 0 1 6 13.4C6 9.4 12 3 12 3z"/>',
  tick:  '<path d="M20 6 9 17l-5-5"/>',
  chev:  '<path d="m9 5 7 7-7 7"/>',
  card:  '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/>',
  phone: '<path d="M21 16.9v2.6a1.7 1.7 0 0 1-1.9 1.7A17 17 0 0 1 3.8 5.9 1.7 1.7 0 0 1 5.5 4h2.6a1.7 1.7 0 0 1 1.7 1.5c.1.9.3 1.7.6 2.5a1.7 1.7 0 0 1-.4 1.8L8.9 11a14 14 0 0 0 5.1 5.1l1.2-1.1a1.7 1.7 0 0 1 1.8-.4c.8.3 1.6.5 2.5.6a1.7 1.7 0 0 1 1.5 1.7z"/>',
  wa:    '<path d="M21 11.6a8.4 8.4 0 0 1-12.3 7.5L3.5 20.5l1.5-5A8.4 8.4 0 1 1 21 11.6z"/>',
  user:  '<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>',
  pin:   '<path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/>',
  cal:   '<rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/>',
  key:   '<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9 2 2-2 2 2 2-3 3-2-2-2 2"/>',
  home:  '<path d="M15 21v-7H9v7"/><path d="M3 10.5 12 3l9 7.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  plus:  '<path d="M5 12h14M12 5v14"/>',
  dl:    '<path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  warn:  '<path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0z"/>'
};

/* ═══════════════════ storage ═══════════════════ */
function readStore(){ try{ var r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }
  catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(D)); }
  catch(e){ toast("Could not save. Browser storage is blocked."); } }

/* ═══════════════════ dates and money ═══════════════════ */
function pad(n){ n=String(n); return n.length<2?"0"+n:n; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function nowM(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function mShift(mk,n){ var p=mk.split("-"),y=+p[0],m=+p[1]-1+n;
  y+=Math.floor(m/12); m=((m%12)+12)%12; return y+"-"+pad(m+1); }
function mName(mk){ var p=mk.split("-"); return FULLMON[+p[1]-1]+" "+p[0]; }
function dShort(iso){ if(!iso) return ""; var p=iso.split("-"); return String(+p[2])+" "+MON[+p[1]-1]; }
function ord(n){ n=+n||1;
  var s=["th","st","nd","rd"], v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]); }
var NF; try{ NF=new Intl.NumberFormat("en-US",{maximumFractionDigits:0}); }
catch(e){ NF={format:function(n){return String(n);}}; }
function rs(n){ return "Rs "+NF.format(Math.round(+n||0)); }

/* ═══════════════════ helpers ═══════════════════ */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function uid(p){ return (p||"h")+Math.random().toString(36).slice(2,9); }
function blank(){ return {amount:"",due:"",paid:false,paidOn:"",note:""}; }
function getP(o,p){ var a=p.split("."),v=o;
  for(var i=0;i<a.length;i++){ if(v==null) return ""; v=v[a[i]]; } return v==null?"":v; }
function setP(o,p,val){ var a=p.split("."),v=o;
  for(var i=0;i<a.length-1;i++){ if(!v[a[i]]) v[a[i]]={}; v=v[a[i]]; } v[a[a.length-1]]=val; }

function provOf(kind,name){
  var list=KINDS[kind].providers;
  for(var i=0;i<list.length;i++) if(list[i].n===name) return list[i];
  return list[0];
}
function newMeter(kind,provName){
  var p=provOf(kind,provName);
  return {id:uid("m"), kind:kind, prov:p.n, url:p.u, ref:"", label:""};
}
function emptyHouse(){
  return {id:uid(), name:"", addr:"", type:"rent", rentDay:5,
    tenant:{name:"",phone:"",rent:"",deposit:"",since:""},
    meters:[newMeter("electric","MEPCO"), newMeter("gas","SNGPL"), newMeter("water","WASA")]};
}
function houseById(id){ for(var i=0;i<D.houses.length;i++) if(D.houses[i].id===id) return D.houses[i]; return null; }
function meterById(h,id){ var m=h.meters||[];
  for(var i=0;i<m.length;i++) if(m[i].id===id) return m[i]; return null; }

function meterName(h,m){
  var base=m.prov||KINDS[m.kind].name;
  if(m.label) return base+" · "+m.label;
  var peers=(h.meters||[]).filter(function(x){
    return x.kind===m.kind && (x.prov||"")===(m.prov||"") && !x.label; });
  if(peers.length>1){
    var tail=m.ref ? String(m.ref).replace(/\s+/g,"").slice(-4) : "#"+(peers.indexOf(m)+1);
    return base+" · "+tail;
  }
  return base;
}
function itemsOf(h){
  var out=[];
  if(h.type!=="own") out.push({key:"rent", kind:"rent", name:"Rent", icon:"rent"});
  (h.meters||[]).forEach(function(m){
    out.push({key:m.id, kind:m.kind, name:meterName(h,m), icon:KINDS[m.kind].icon, meter:m});
  });
  return out;
}

function peek(mk,hid){
  var src=(D.entries[mk]||{})[hid]||{}, out={};
  for(var k in src){
    if(!Object.prototype.hasOwnProperty.call(src,k)) continue;
    var it=src[k]||{};
    out[k]={amount:it.amount==null?"":it.amount, due:it.due||"", paid:!!it.paid,
            paidOn:it.paidOn||"", note:it.note||""};
  }
  return out;
}
function pick(rec,key){ return rec[key]||blank(); }
function ensure(mk,hid,key){
  if(!D.entries[mk]) D.entries[mk]={};
  if(!D.entries[mk][hid]) D.entries[mk][hid]={};
  var r=D.entries[mk][hid];
  if(!r[key]) r[key]=blank();
  return r[key];
}
function amtOf(h,item,it){
  if(it.amount!=="" && it.amount!=null) return +it.amount||0;
  if(item.key==="rent") return +getP(h,"tenant.rent")||0;
  return 0;
}
function dueOf(h,item,it,mk){
  if(item.key==="rent") return mk+"-"+pad(Math.min(28,Math.max(1,+h.rentDay||5)));
  return it.due||"";
}
function statOf(h,item,it,mk){
  if(it.paid) return "paid";
  if(!amtOf(h,item,it)) return "none";
  var d=dueOf(h,item,it,mk);
  return (d && today()>d) ? "late" : "due";
}
function monthTotals(mk){
  var owed=0,done=0,nOwed=0,nDone=0;
  D.houses.forEach(function(h){
    var e=peek(mk,h.id);
    itemsOf(h).forEach(function(item){
      var it=pick(e,item.key), s=statOf(h,item,it,mk), a=amtOf(h,item,it);
      if(s==="paid"){ done+=a; nDone++; }
      else if(s==="due"||s==="late"){ owed+=a; nOwed++; }
    });
  });
  return {owed:owed,done:done,nOwed:nOwed,nDone:nDone,total:owed+done};
}

/* ═══════════════════ migration from v1 ═══════════════════ */
function migrate(d){
  if(!d || !d.houses) return d;
  if(d.v>=VERSION) return d;
  var PMAP={"LESCO / MEPCO / GEPCO / FESCO / IESCO":"MEPCO","K-Electric":"K-Electric",
            "SNGPL":"SNGPL","SSGC":"SSGC","WASA / Water Board":"WASA"};
  var KMAP={bijli:"electric", gas:"gas", pani:"water"};
  var DEF={electric:"MEPCO", gas:"SNGPL", water:"WASA"};
  d.houses.forEach(function(h){
    if(h.meters) return;
    var u=h.utils||{}, ms=[];
    ["bijli","gas","pani"].forEach(function(old){
      var src=u[old]||{}, kind=KMAP[old];
      var m=newMeter(kind, PMAP[src.prov]||DEF[kind]);
      m.id="m_"+old+"_"+h.id;
      m.ref=src.ref||"";
      if(src.url) m.url=src.url;
      ms.push(m);
    });
    h.meters=ms;
    delete h.utils;
  });
  var ents=d.entries||{};
  Object.keys(ents).forEach(function(mk){
    var mo=ents[mk]||{};
    Object.keys(mo).forEach(function(hid){
      var rec=mo[hid]||{}, out={};
      if(rec.rent) out.rent=rec.rent;
      ["bijli","gas","pani"].forEach(function(old){
        if(rec[old]) out["m_"+old+"_"+hid]=rec[old];
      });
      mo[hid]=out;
    });
  });
  d.v=VERSION;
  return d;
}

var tT,tEl;
function toast(m){
  if(!tEl){ tEl=document.createElement("div"); tEl.className="toast"; document.body.appendChild(tEl); }
  tEl.textContent=m;
  requestAnimationFrame(function(){ tEl.classList.add("on"); });
  clearTimeout(tT);
  tT=setTimeout(function(){ tEl.classList.remove("on"); },2300);
}
function copy(txt,lab){
  function ok(){ toast((lab||"Text")+" copied"); }
  function fb(){
    try{ var t=document.createElement("textarea"); t.value=txt;
      t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t);
      t.select(); document.execCommand("copy"); document.body.removeChild(t); ok();
    }catch(e){ toast("Could not copy"); }
  }
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok,fb); return; } }catch(e){}
  fb();
}

                     ph:"03001234567", rentOnly:true,
                     s:"One tap will call this number or open a WhatsApp reminder."},
  "tenant.rent":    {q:"How much is the monthly rent?", t:"money", k:"Monthly rent", ic:"rent",
                     rentOnly:true},
  "rentDay":        {q:"Rent is due by which day of the month?", t:"day", k:"Rent due by", ic:"cal",
                     rentOnly:true, s:"After this day the app marks the rent overdue on its own."},
  "tenant.deposit": {q:"How much security deposit was taken?", t:"money", k:"Security deposit",
                     ic:"rent", rentOnly:true},
  "tenant.since":   {q:"Since when has the tenant been living here?", t:"date", k:"Tenant since",
                     ic:"cal", rentOnly:true}
};
var DETAIL=["name","addr","type","tenant.name","tenant.phone","tenant.rent","rentDay",
            "tenant.deposit","tenant.since"];

function provSelect(id,kind,current){
  var opts=KINDS[kind].providers.map(function(p){
    return '<option value="'+esc(p.n)+'"'+(p.n===current?" selected":"")+'>'+esc(p.n)+'</option>';
  }).join("");
  return '<select class="input" id="'+id+'">'+opts+'</select>';
}

function fieldHTML(key,val,obj,host){
  if(key.indexOf("meter:")===0){
    var m=obj.meters[+key.slice(6)], K=KINDS[m.kind];
    return '<input class="input" id="fv" type="text" inputmode="numeric" value="'+esc(m.ref)+'" '+
      'placeholder="'+esc(K.ph)+'">'+
      '<div class="field" style="margin-top:var(--space-3)"><label for="fprov">Provider</label>'+
      provSelect("fprov",m.kind,m.prov)+
      '<div class="hint">Choosing the provider also sets the link used to look up the bill.</div></div>';
  }
  var d=F[key];
  if(d.t==="choice")
    return '<div class="pick" data-pickfor="'+esc(host||"wiz")+'">'+
      '<button data-pick="rent"><b>Rented out</b>'+
        '<span>Tenant, rent and every meter are tracked.</span></button>'+
      '<button data-pick="own"><b>Own home</b>'+
        '<span>Only the utility bills are tracked.</span></button></div>';
  if(d.t==="money")
    return '<input class="input big" id="fv" type="number" inputmode="numeric" value="'+esc(val)+'" placeholder="0">';
  if(d.t==="day")
    return '<input class="input big" id="fv" type="number" inputmode="numeric" min="1" max="28" value="'+esc(val||5)+'">';
  if(d.t==="date")
    return '<input class="input" id="fv" type="date" value="'+esc(val)+'">';
  if(d.t==="tel")
    return '<input class="input" id="fv" type="tel" inputmode="tel" value="'+esc(val)+'" placeholder="'+esc(d.ph||"")+'">';
  return '<input class="input" id="fv" type="text" value="'+esc(val)+'" placeholder="'+esc(d.ph||"")+'">';
}
function readField(key,target){
  var el=document.getElementById("fv");
  if(!el) return true;
  var v=el.value.trim();
  if(key.indexOf("meter:")===0){
    var m=target.meters[+key.slice(6)];
    m.ref=v;
    var sel=document.getElementById("fprov");
    if(sel && sel.value){ var p=provOf(m.kind,sel.value); m.prov=p.n; m.url=p.u; }
    return true;
  }
  var d=F[key];
  if(d.req && !v){ toast("This one is required"); el.focus(); return false; }
  if(d.t==="money") v = v===""?"":(+v||0);
  if(d.t==="day")   v = Math.min(28,Math.max(1,+v||5));
  setP(target,key,v);
  return true;
}
function fieldQ(key,obj){
  if(key.indexOf("meter:")===0){
    var m=obj.meters[+key.slice(6)];
    return {q:KINDS[m.kind].q, s:KINDS[m.kind].hint, req:false};
  }
  return F[key];
}

/* ═══════════════════ new-property wizard ═══════════════════ */
function wizSteps(){
  var base=["type","name","tenant.name","tenant.phone","tenant.rent","rentDay"]
    .filter(function(k){ return !(F[k].rentOnly && W.draft.type==="own"); });
  W.draft.meters.forEach(function(m,i){ base.push("meter:"+i); });
  return base;
}
function wizOpen(){ W={draft:emptyHouse(), i:0}; wizDraw(); }
function wizDraw(){
  var steps=wizSteps(), key=steps[W.i], d=fieldQ(key,W.draft);
  var pct=Math.round(W.i/steps.length*100);
  openSheet(
    '<div class="wprog"><i style="width:'+pct+'%"></i></div>'+
    '<div class="kk">Step '+(W.i+1)+' of '+steps.length+'</div>'+
    '<h3>'+esc(d.q)+'</h3>'+
    '<div class="sub">'+esc(d.s||"Skip anything you do not know yet.")+'</div>'+
    fieldHTML(key,getP(W.draft,key),W.draft,"wiz")+
    (d.t==="choice" ? '' :
      '<div class="brow" style="margin-top:var(--space-4)">'+
      '<button class="btn btn-secondary" data-wiz="back"'+(W.i===0?' disabled':'')+'>Back</button>'+
      '<button class="btn btn-primary" data-wiz="next">'+
        (W.i===steps.length-1?"Finish":"Next")+'</button></div>'+
      (d.req?'':'<button class="skip" data-wiz="skip">skip this, I will add it later</button>')),
    true
  );
}
function wizGo(dir){
  var steps=wizSteps(), key=steps[W.i];
  if(dir==="back"){ if(W.i>0){ W.i--; wizDraw(); } return; }
  if(dir==="next" && !readField(key,W.draft)) return;
  if(W.i < wizSteps().length-1){ W.i++; wizDraw(); return; }
  var h=W.draft;
  if(!h.name){ toast("The property needs a name"); return; }
  if(h.type==="own") h.tenant={name:"",phone:"",rent:0,deposit:"",since:""};
  D.houses.push(h); save(); closeSheet(); S.tab="dash"; render();
  toast(h.name+" added");
}

/* ═══════════════════ property details ═══════════════════ */
function detailSheet(hid){
  var h=houseById(hid); if(!h) return;
  var rows="";
  DETAIL.forEach(function(key){
    var d=F[key];
    if(d.rentOnly && h.type==="own") return;
    var raw=getP(h,key), v;
    if(key==="type") v = h.type==="own" ? "Own home" : "Rented out";
    else if(d.t==="money") v = raw===""?"":rs(raw);
    else if(key==="rentDay") v = raw ? ord(raw)+" of each month" : "";
    else v=raw;
    rows+='<button class="srow" data-edit="'+hid+'|'+key+'">'+
      '<span class="si2">'+sv(IC[d.ic]||IC.pin,15,2.5)+'</span>'+
      '<span class="st"><b>'+esc(d.k)+'</b>'+
        '<span class="'+(v?"set":"")+'">'+esc(v||"not set")+'</span></span>'+
      '<span class="chev">'+sv(IC.chev,15,2.6)+'</span></button>';
  });

  var mrows="";
  (h.meters||[]).forEach(function(m){
    mrows+='<button class="srow" data-meter="'+hid+'|'+m.id+'">'+
      '<span class="si2">'+sv(IC[KINDS[m.kind].icon],15,2.5)+'</span>'+
      '<span class="st"><b>'+esc(meterName(h,m))+'</b>'+
        '<span class="'+(m.ref?"set":"")+'">'+esc(m.ref||"reference number not set")+'</span></span>'+
      '<span class="chev">'+sv(IC.chev,15,2.6)+'</span></button>';
  });
  if(!mrows) mrows='<div class="hint" style="padding:var(--space-3) 0">'+
    'No meters yet. Add one for every electricity, gas and water connection in this property.</div>';

  openSheet(
    '<div class="kk">Property details</div>'+
    '<h3>'+esc(h.name)+'</h3>'+
    '<div class="sub">Tap any line to change just that one item.</div>'+
    rows+
    '<div class="sechd">Meters and connections</div>'+
    mrows+
    '<button class="addm" data-meter="'+hid+'|new">'+sv(IC.plus,14,2.8)+'Add another meter</button>'+
    '<div class="hint" style="margin-top:var(--space-2)">A property can have as many meters as it '+
      'needs. Each one keeps its own reference number and its own monthly bill.</div>'+
    '<div class="dangerzone">'+
    '<button class="btn btn-secondary" data-close="1">Close</button>'+
    '<button class="btn btn-alert" data-del="'+esc(hid)+'">Delete this property</button></div>'
  );
}
function editSheet(hid,key){
  var h=houseById(hid); if(!h) return;
  var d=F[key];
  openSheet(
    '<div class="kk">'+esc(h.name)+'</div>'+
    '<h3>'+esc(d.q)+'</h3>'+
    '<div class="sub">'+esc(d.s||"Change it and save.")+'</div>'+
    fieldHTML(key,getP(h,key),h,h.id)+
    (d.t==="choice" ? '' :
      '<div class="brow" style="margin-top:var(--space-4)">'+
      '<button class="btn btn-secondary" data-back="'+esc(hid)+'">Back</button>'+
      '<button class="btn btn-primary" data-savefield="'+esc(hid)+'|'+esc(key)+'">Save</button></div>')
  );
}

/* ═══════════════════ meter sheet ═══════════════════ */
function meterSheet(hid,mid){
  var h=houseById(hid); if(!h) return;
  var m = mid==="new" ? null : meterById(h,mid);
  MS = {hid:hid, mid:m?m.id:null,
        d: m ? {kind:m.kind, prov:m.prov, url:m.url, ref:m.ref, label:m.label}
             : {kind:"electric", prov:"MEPCO", url:PITC, ref:"", label:""}};
  meterDraw();
}
function meterRead(){
  if(!MS) return;
  function gv(id){ var e=document.getElementById(id); return e?e.value.trim():""; }
  MS.d.ref=gv("m-ref"); MS.d.label=gv("m-label"); MS.d.url=gv("m-url");
  var sel=document.getElementById("m-prov");
  if(sel && sel.value) MS.d.prov=sel.value;
}
function meterDraw(){
  var d=MS.d, K=KINDS[d.kind];
  var segs=KIND_ORDER.map(function(k){
    return '<button class="'+(k===d.kind?"on a":"")+'" data-mkind="'+k+'">'+KINDS[k].name+'</button>';
  }).join("");
  openSheet(
    '<div class="kk">'+(MS.mid?"Meter":"New meter")+'</div>'+
    '<h3>'+(MS.mid?"Meter details":"Add a meter")+'</h3>'+
    '<div class="sub">Each connection keeps its own reference number and its own monthly bill.</div>'+
    '<div class="field"><label>Type</label><div class="seg three">'+segs+'</div></div>'+
    '<div class="field"><label for="m-prov">Provider</label>'+provSelect("m-prov",d.kind,d.prov)+'</div>'+
    '<div class="field"><label for="m-ref">Reference number</label>'+
      '<input class="input" id="m-ref" type="text" inputmode="numeric" value="'+esc(d.ref)+'" '+
      'placeholder="'+esc(K.ph)+'"><div class="hint">'+esc(K.hint)+'</div></div>'+
    '<div class="field"><label for="m-label">Name this meter</label>'+
      '<input class="input" id="m-label" type="text" value="'+esc(d.label)+'" placeholder="optional">'+
      '<div class="hint">Useful when one property has more than one meter of the same kind. '+
      'For example: Shop, Upper portion.</div></div>'+
    '<div class="field"><label for="m-url">Bill website</label>'+
      '<input class="input" id="m-url" type="url" value="'+esc(d.url)+'" placeholder="https://">'+
      '<div class="hint">Where the bill is looked up. Change it if this link does not work in your area.</div></div>'+
    '<div class="brow" style="margin-top:var(--space-4)">'+
      '<button class="btn btn-secondary" data-back="'+esc(MS.hid)+'">Back</button>'+
      '<button class="btn btn-primary" data-savemeter="1">Save meter</button></div>'+
    (MS.mid ? '<button class="btn btn-alert" style="margin-top:var(--space-2)" '+
      'data-delmeter="1">Remove this meter</button>' : ''),
    true
  );
}
function meterSave(){
  meterRead();
  var h=houseById(MS.hid); if(!h) return;
  if(!h.meters) h.meters=[];
  var d=MS.d;
  if(MS.mid){
    var m=meterById(h,MS.mid);
    if(m){ m.kind=d.kind; m.prov=d.prov; m.url=d.url; m.ref=d.ref; m.label=d.label; }
  }else{
    var nm=newMeter(d.kind,d.prov);
    nm.url=d.url; nm.ref=d.ref; nm.label=d.label;
    h.meters.push(nm);
  }
  var hid=MS.hid;
  save(); render(); detailSheet(hid); toast("Meter saved");
}
function meterDelete(){
  var h=houseById(MS.hid); if(!h || !MS.mid) return;
  var m=meterById(h,MS.mid);
  if(!confirm('Remove "'+(m?meterName(h,m):"this meter")+'" and every bill recorded against it?')) return;
  var hid=MS.hid, mid=MS.mid;
  h.meters=h.meters.filter(function(x){ return x.id!==mid; });
  Object.keys(D.entries).forEach(function(mk){
    var rec=(D.entries[mk]||{})[hid];
    if(rec) delete rec[mid];
  });
  save(); render(); detailSheet(hid); toast("Meter removed");
}

/* ═══════════════════ events ═══════════════════ */
document.getElementById("tabs").addEventListener("click",function(e){
  var b=e.target.closest("button[data-tab]"); if(!b) return;
  S.tab=b.getAttribute("data-tab"); window.scrollTo(0,0); render();
});
document.getElementById("fab").addEventListener("click",function(){ wizOpen(); });

document.addEventListener("click",function(e){
  var t=e.target,n;

  if((n=t.closest("[data-mv]"))){
    var dv=+n.getAttribute("data-mv");
    S.month = dv===0 ? nowM() : mShift(S.month,dv);
    render(); return;
  }
  if((n=t.closest("[data-tick]"))){
    e.preventDefault(); e.stopPropagation();
    var p=n.getAttribute("data-tick").split("|"), h=houseById(p[0]);
    var it=ensure(S.month,p[0],p[1]);
    it.paid=!it.paid;
    if(it.paid){
      if((it.amount===""||it.amount==null) && p[1]==="rent" && h)
        it.amount=getP(h,"tenant.rent")||"";
      it.paidOn=it.paidOn||today();
    } else it.paidOn="";
    save(); render(); return;
  }
  if((n=t.closest("[data-item]"))){ var q=n.getAttribute("data-item").split("|"); itemSheet(q[0],q[1]); return; }
  if((n=t.closest("[data-toggle]"))){ var id=n.getAttribute("data-toggle"); S.open[id]=!S.open[id]; render(); return; }
  if((n=t.closest("[data-copy]"))){ copy(n.getAttribute("data-copy"),"Reference number"); return; }
  if((n=t.closest("[data-detail]"))){ detailSheet(n.getAttribute("data-detail")); return; }
  if((n=t.closest("[data-edit]"))){ var w=n.getAttribute("data-edit").split("|"); editSheet(w[0],w[1]); return; }
  if((n=t.closest("[data-meter]"))){ var y=n.getAttribute("data-meter").split("|"); meterSheet(y[0],y[1]); return; }
  if((n=t.closest("[data-mkind]"))){
    if(!MS) return;
    meterRead();
    var k=n.getAttribute("data-mkind");
    if(k!==MS.d.kind){ MS.d.kind=k; var p=KINDS[k].providers[0]; MS.d.prov=p.n; MS.d.url=p.u; }
    meterDraw(); return;
  }
  if(t.closest("[data-savemeter]")){ meterSave(); return; }
  if(t.closest("[data-delmeter]")){ meterDelete(); return; }
  if((n=t.closest("[data-back]"))){ detailSheet(n.getAttribute("data-back")); return; }
  if((n=t.closest("[data-xtra]"))){ document.getElementById("xtra").style.display=""; n.style.display="none"; return; }
  if((n=t.closest("[data-saveitem]"))){ var v=n.getAttribute("data-saveitem").split("|"); saveItem(v[0],v[1]); return; }

  if((n=t.closest("[data-pick]"))){
    var val=n.getAttribute("data-pick");
    var host=n.parentNode?n.parentNode.getAttribute("data-pickfor"):"wiz";
    if(host==="wiz"){ if(W){ W.draft.type=val; W.i++; wizDraw(); } return; }
    var eh=houseById(host);
    if(eh){
      eh.type=val;
      if(val==="own") eh.tenant={name:"",phone:"",rent:0,deposit:"",since:""};
      save(); render(); detailSheet(host); toast("Saved");
    }
    return;
  }
  if((n=t.closest("[data-wiz]"))){
    var a=n.getAttribute("data-wiz");
    if(a==="skip"){ if(W.i<wizSteps().length-1){ W.i++; wizDraw(); } else wizGo("next"); return; }
    wizGo(a); return;
  }
  if((n=t.closest("[data-savefield]"))){
    var z=n.getAttribute("data-savefield").split("|"), hh=houseById(z[0]);
    if(!hh) return;
    if(!readField(z[1],hh)) return;
    if(hh.type==="own") hh.tenant={name:"",phone:"",rent:0,deposit:"",since:""};
    save(); render(); detailSheet(z[0]); toast("Saved"); return;
  }
  if((n=t.closest("[data-del]"))){
    var did=n.getAttribute("data-del"), tg=houseById(did);
    if(!confirm('Delete "'+(tg?tg.name:"")+'" and its entire record? This cannot be undone.')) return;
    D.houses=D.houses.filter(function(x){ return x.id!==did; });
    Object.keys(D.entries).forEach(function(m){ if(D.entries[m]) delete D.entries[m][did]; });
    save(); closeSheet(); render(); toast("Property deleted"); return;
  }
  if((n=t.closest("[data-remind]"))){
    var rh=houseById(n.getAttribute("data-remind")); if(!rh) return;
    var re=pick(peek(S.month,rh.id),"rent");
    var amount=amtOf(rh,{key:"rent"},re);
    var dg=String(getP(rh,"tenant.phone")).replace(/\D/g,"");
    if(dg.charAt(0)==="0") dg="92"+dg.slice(1);
    var msg="Assalam-o-Alaikum "+(getP(rh,"tenant.name")||"")+", this is a reminder that the rent "+
      "for "+mName(S.month)+" of "+rs(amount)+" is still outstanding. Kindly arrange the payment "+
      "at your earliest convenience. Thank you.";
    window.open("https://wa.me/"+dg+"?text="+encodeURIComponent(msg),"_blank","noopener");
    return;
  }

  if((n=t.closest("[data-act]"))){
    var act=n.getAttribute("data-act");
    if(act==="newhouse"){ wizOpen(); return; }
    if(act==="install"){
      var dp=INSTALL.p; if(!dp) return;
      INSTALL.p=null; render();
      dp.prompt();
      if(dp.userChoice) dp.userChoice.then(function(c){
        toast(c && c.outcome==="accepted" ? "Installing" : "No problem, maybe later");
      });
      return;
    }
    if(act==="cleardemo"){
      if(!confirm("Clear all the sample data and start with an empty register?")) return;
      D={v:VERSION, houses:[], entries:{}, demo:false}; save(); S.tab="props"; render();
      toast("Add your first property"); return;
    }
    if(act==="copybk"){ copy(JSON.stringify(D),"Backup"); return; }
    if(act==="restore"){
      var raw=document.getElementById("bi").value.trim();
      if(!raw){ toast("Paste the backup text first"); return; }
      var pj; try{ pj=JSON.parse(raw); }catch(err){ toast("That text is not a valid backup"); return; }
      if(!pj || !pj.houses){ toast("No property data found in that text"); return; }
      if(!confirm("Replace everything currently in the app with this backup?")) return;
      D=migrate({v:pj.v||1, houses:pj.houses||[], entries:pj.entries||{}, demo:!!pj.demo});
      D.v=VERSION;
      save(); S.tab="dash"; render(); toast("Backup restored"); return;
    }
    if(act==="wipe"){
      if(!confirm("Erase every property, every bill and the full history?")) return;
      if(!confirm("Final check: erase everything for good?")) return;
      D={v:VERSION, houses:[], entries:{}, demo:false}; save(); S.tab="props"; render();
      toast("Register erased"); return;
    }
  }

  if(t.closest("[data-close]") || t.getAttribute("data-bg")==="1"){ closeSheet(); return; }
});

/* ═══════════ PWA: manifest, icons, app-mode meta ═══════════ */
(function pwa(){
  var head=document.head; if(!head) return;
  var hosted = /^https?:$/.test(location.protocol);

  if(hosted && navigator.serviceWorker){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
  if(head.querySelector('link[rel="manifest"]')) return;

  function meta(n,c){ var m=document.createElement("meta"); m.name=n; m.content=c;
    head.appendChild(m); return m; }
  function link(r,h,extra){ var l=document.createElement("link"); l.rel=r; l.href=h;
    if(extra) for(var k in extra) l[k]=extra[k]; head.appendChild(l); return l; }

  var vp=head.querySelector('meta[name="viewport"]');
  var vpc="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover";
  if(vp) vp.setAttribute("content",vpc); else meta("viewport",vpc);

  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  var tc = meta("theme-color", (mq && mq.matches) ? "#191614" : "#f5ead8");
  if(mq){
    var onT=function(){ tc.setAttribute("content", mq.matches?"#191614":"#f5ead8"); };
    if(mq.addEventListener) mq.addEventListener("change",onT);
    else if(mq.addListener) mq.addListener(onT);
  }

  meta("apple-mobile-web-app-capable","yes");
  meta("mobile-web-app-capable","yes");
  meta("apple-mobile-web-app-status-bar-style","default");
  meta("apple-mobile-web-app-title","Kiraya Register");
  meta("application-name","Kiraya Register");
  link("apple-touch-icon", ICON.i180);
  link("icon", ICON.i192, {type:"image/png", sizes:"192x192"});

  var base=location.href.split("#")[0].split("?")[0];
  var man={
    name:"Kiraya Register", short_name:"Kiraya",
    description:"Rent, electricity, gas and water bills for every property in one place.",
    start_url: base, scope: base.replace(/[^\/]*$/,""),
    display:"standalone", orientation:"portrait",
    background_color:"#f5ead8", theme_color:"#f5ead8", lang:"en", dir:"ltr",
    icons:[
      {src:ICON.i192, sizes:"192x192", type:"image/png", purpose:"any"},
      {src:ICON.i512, sizes:"512x512", type:"image/png", purpose:"any"},
      {src:ICON.m512, sizes:"512x512", type:"image/png", purpose:"maskable"}
    ]
  };
  function inlineManifest(){
    try{
      return URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}));
    }catch(e){
      return "data:application/manifest+json;charset=utf-8,"+encodeURIComponent(JSON.stringify(man));
    }
  }
  link("manifest", inlineManifest());
})();

});
window.addEventListener("appinstalled", function(){
  INSTALL.p=null; render(); toast("Installed. Look for the icon on your home screen.");
});

render();
