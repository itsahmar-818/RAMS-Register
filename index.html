<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Rent, electricity, gas and water bills for every property in one place.">
<meta name="theme-color" content="#f5ead8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kiraya Register">
<meta name="application-name" content="Kiraya Register">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Kiraya Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
/* apply saved theme before first paint */
(function(){ try{ var d=JSON.parse(localStorage.getItem("kiraya-register-v1")||"{}"), t=(d.settings||{}).theme||"system";
  var dark=t==="dark"||(t==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme",dark?"dark":"light"); }catch(e){} })();
</script>
<style>
/* ═══════════════════════════════════════════════════════════════════
   Kiraya Register 3.1 — RAMS organic design system
   Same tokens, type and shapes as RAMS Electric, so both apps read
   as one brand.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --color-bg:#f5ead8;
  --color-surface:#ebddc5;
  --color-text:#201e1d;
  --color-accent:#c67139;
  --color-accent-2:#7a8a5e;
  --color-divider:color-mix(in srgb,#201e1d 16%,transparent);

  --color-neutral-100:#f9f4ed; --color-neutral-200:#eee7db; --color-neutral-300:#dcd3c4;
  --color-neutral-400:#c0b6a5; --color-neutral-500:#a19786; --color-neutral-600:#82796a;
  --color-neutral-700:#645c50; --color-neutral-800:#474238; --color-neutral-900:#2e2b25;

  --color-accent-100:#fff2eb; --color-accent-200:#ffe1d0; --color-accent-300:#ffc6a5;
  --color-accent-400:#f6a06b; --color-accent-500:#d67f48; --color-accent-600:#b2622d;
  --color-accent-700:#8c491a; --color-accent-800:#643312; --color-accent-900:#402310;

  --color-accent-2-100:#f0fae1; --color-accent-2-200:#e1eecc; --color-accent-2-300:#ccdbb2;
  --color-accent-2-400:#aebf92; --color-accent-2-500:#8fa073; --color-accent-2-600:#728157;
  --color-accent-2-700:#56633f; --color-accent-2-800:#3d472b; --color-accent-2-900:#272e1b;

  --color-alert:#b8402a; --color-alert-100:#ffe3db; --color-alert-700:#8a2a17;

  /* utility kinds, kept in the same earthy family */
  --k-rent:var(--color-accent-2);   --k-rent-bg:var(--color-accent-2-100); --k-rent-fg:var(--color-accent-2-700);
  --k-elec:var(--color-accent);     --k-elec-bg:var(--color-accent-100);   --k-elec-fg:var(--color-accent-700);
  --k-gas:#c9962e;                  --k-gas-bg:#fbf0d4;                    --k-gas-fg:#7d5a12;
  --k-water:#5f8a8b;                --k-water-bg:#e3efee;                  --k-water-fg:#355c5d;

  --font-heading:"Caprasimo",Georgia,"Times New Roman",serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

  --space-1:4.4px; --space-2:8.8px; --space-3:13.2px;
  --space-4:17.6px; --space-6:26.4px; --space-8:35.2px;
  --radius-sm:8px; --radius-md:16px; --radius-lg:28px;

  --shadow-sm:0 1px 2px color-mix(in srgb,#2e2b25 14%,transparent);
  --shadow-md:0 3px 10px color-mix(in srgb,#2e2b25 16%,transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb,#2e2b25 22%,transparent);

  --ease:cubic-bezier(.22,1,.36,1);
  --bar-h:66px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html[data-theme="dark"]{
  --color-bg:#191614; --color-surface:#241f1c; --color-text:#f4ebdd;
  --color-divider:color-mix(in srgb,#f4ebdd 18%,transparent);
  --color-neutral-100:#211d1a; --color-neutral-200:#2b2622; --color-neutral-300:#3b342d;
  --color-neutral-400:#544c42; --color-neutral-500:#7d7365; --color-neutral-600:#a89c8a;
  --color-neutral-700:#c8bcaa; --color-neutral-800:#e0d5c3; --color-neutral-900:#f4ebdd;
  --color-accent:#d9834b;
  --color-accent-100:#33231a; --color-accent-200:#432d20; --color-accent-300:#5c3d29;
  --color-accent-400:#8a5a33; --color-accent-500:#b5743f; --color-accent-600:#d0894f;
  --color-accent-700:#eba86f; --color-accent-800:#f6c79b; --color-accent-900:#fde3c8;
  --color-accent-2:#8fa073;
  --color-accent-2-100:#22271b; --color-accent-2-200:#2e3524; --color-accent-2-300:#3f4931;
  --color-accent-2-400:#5b6a45; --color-accent-2-500:#788a5c; --color-accent-2-600:#93a678;
  --color-accent-2-700:#b3c496; --color-accent-2-800:#cfdcb6; --color-accent-2-900:#e6efd6;
  --color-alert:#e8674a; --color-alert-100:#3a1d16; --color-alert-700:#ff9e86;
  --k-gas:#dcae4a; --k-gas-bg:#30260f; --k-gas-fg:#f0cf83;
  --k-water:#7fb0b1; --k-water-bg:#16282a; --k-water-fg:#a9d3d3;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow-md:0 3px 10px rgba(0,0,0,.55);
  --shadow-lg:0 12px 32px rgba(0,0,0,.62);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--color-bg);}
body{margin:0;background:var(--color-bg);color:var(--color-text);
  font-family:var(--font-body);font-size:15px;line-height:1.55;font-weight:400;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior-y:none;}
h1,h2,h3{font-family:var(--font-heading);font-weight:400;line-height:1.12;letter-spacing:-.015em;margin:0;}
button,input,select,textarea{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;
  border:none;background:none;margin:0;}
button{cursor:pointer;padding:0;text-align:inherit;}
a{color:inherit;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;}
[hidden]{display:none!important;}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent);}
.n,.num{font-variant-numeric:tabular-nums;}
button,.tab,.tag,.pill,.chipf,.eyebrow{-webkit-user-select:none;user-select:none;touch-action:manipulation;}
.hd{font-family:var(--font-heading);font-weight:400;}

/* ─── shell ─────────────────────────────────────────────── */
#shell{max-width:440px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh;}
#shell::before{content:'';position:fixed;top:-90px;right:-70px;width:260px;height:260px;border-radius:50%;
  background:color-mix(in srgb,var(--color-accent) 13%,transparent);pointer-events:none;z-index:0;
  animation:float1 14s ease-in-out infinite alternate;}
#shell::after{content:'';position:fixed;top:130px;left:-95px;width:190px;height:190px;border-radius:50%;
  background:color-mix(in srgb,var(--color-accent-2) 14%,transparent);pointer-events:none;z-index:0;
  animation:float2 17s ease-in-out infinite alternate;}
html[data-theme="dark"] #shell::before{background:color-mix(in srgb,var(--color-accent) 7%,transparent);}
html[data-theme="dark"] #shell::after{background:color-mix(in srgb,var(--color-accent-2) 7%,transparent);}
@keyframes float1{to{transform:translate(-18px,22px) scale(1.06);}}
@keyframes float2{to{transform:translate(16px,-14px) scale(.95);}}

.appbar{position:sticky;top:0;z-index:50;padding:calc(var(--sat) + var(--space-4)) var(--space-4) var(--space-3);
  background:linear-gradient(to bottom,var(--color-bg) 74%,transparent);
  display:flex;align-items:center;gap:var(--space-3);}
.mark{width:38px;height:38px;border-radius:999px;flex:none;color:var(--color-bg);
  background:linear-gradient(140deg,var(--color-accent-400),var(--color-accent-700));
  display:grid;place-items:center;box-shadow:var(--shadow-sm);transition:transform .16s;}
.mark:active{transform:scale(.92);}
.brand{margin-right:auto;min-width:0;}
.brand .nn{font-family:var(--font-heading);font-size:19px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand .s{font-size:10.5px;letter-spacing:.09em;color:var(--color-neutral-600);margin-top:3px;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip{display:flex;align-items:center;gap:var(--space-2);background:var(--color-surface);
  border-radius:999px;padding:6px 13px 6px 7px;flex:none;}
.chip .cd{width:26px;height:26px;border-radius:999px;flex:none;display:grid;place-items:center;
  background:var(--color-accent-2);color:var(--color-bg);}
.chip.over .cd{background:var(--color-alert);}
.chip .t{line-height:1.2;}
.chip .t b{display:block;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
.chip .t span{font-size:9.5px;color:var(--color-neutral-600);}
.chip.over .t b{color:var(--color-alert);}

main{position:relative;z-index:1;padding:0 var(--space-4) calc(var(--bar-h) + var(--sab) + var(--space-8));}
.view{animation:pin .34s var(--ease);}
@keyframes pin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--color-neutral-600);
  font-weight:700;margin:var(--space-6) var(--space-2) var(--space-2);display:flex;align-items:center;gap:8px;}
.eyebrow.first{margin-top:var(--space-2);}
.eyebrow .r{margin-left:auto;letter-spacing:.04em;text-transform:none;font-size:11.5px;}
.eyebrow button.r{color:var(--color-accent-700);font-weight:700;}

/* ─── card ──────────────────────────────────────────────── */
.card{display:block;width:100%;text-align:left;padding:var(--space-4);border-radius:calc(var(--radius-lg) * 1.15);
  background:var(--color-surface);margin-bottom:var(--space-3);box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.card.flat{padding:0;}
.anim .card,.anim .tile,.anim .ocard,.anim .group{animation:rise .55s var(--ease) both;}
.anim .card:nth-child(2){animation-delay:.05s;} .anim .card:nth-child(3){animation-delay:.1s;}
.anim .card:nth-child(4){animation-delay:.15s;} .anim .card:nth-child(5){animation-delay:.2s;}
.anim .card:nth-child(n+6){animation-delay:.25s;}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985);}to{opacity:1;transform:none;}}

/* ─── tags / pills ──────────────────────────────────────── */
.pill,.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;letter-spacing:.02em;
  padding:3px 11px;border-radius:999px;font-weight:600;white-space:nowrap;flex:none;}
.pill.ok{background:var(--color-accent-2-100);color:var(--color-accent-2-800);}
.pill.due{background:var(--color-accent-100);color:var(--color-accent-800);}
.pill.late{background:var(--color-alert-100);color:var(--color-alert-700);}
.pill.none{background:color-mix(in srgb,var(--color-text) 7%,transparent);color:var(--color-neutral-600);}
.pill.info{background:var(--k-water-bg);color:var(--k-water-fg);}

/* ─── home hero ─────────────────────────────────────────── */
.hero{background:linear-gradient(140deg,color-mix(in srgb,var(--color-accent) 22%,var(--color-surface)) 0%,
      var(--color-surface) 62%);}
.hrow1{display:flex;align-items:center;gap:var(--space-3);}
.hello{flex:1;min-width:0;}
.hello small{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--color-accent-700);}
.hello b{display:block;font-family:var(--font-heading);font-weight:400;font-size:21px;line-height:1.1;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hbtn{width:34px;height:34px;border-radius:999px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--color-text) 8%,transparent);color:var(--color-neutral-700);}
.hbtn:active{background:color-mix(in srgb,var(--color-text) 18%,transparent);}

.mswitch{display:flex;border:1px solid var(--color-divider);border-radius:999px;overflow:hidden;margin:var(--space-4) 0 0;}
.mswitch button{padding:9px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;}
.mswitch button + button{border-left:1px solid var(--color-divider);}
.mswitch .arr{flex:1;color:var(--color-neutral-700);}
.mswitch .arr:active{background:color-mix(in srgb,var(--color-text) 10%,transparent);}
.mswitch .cur{flex:3;background:var(--color-accent);color:var(--color-bg);}
.mswitch .cur i{font-style:normal;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;
  background:color-mix(in srgb,var(--color-bg) 25%,transparent);border-radius:999px;padding:1px 7px;}

.mrow{display:flex;align-items:center;gap:var(--space-4);margin-top:var(--space-4);}
.gauge{width:108px;height:108px;flex:none;position:relative;}
.gauge svg{width:100%;height:100%;transform:rotate(135deg);display:block;overflow:visible;}
.gauge .trk{fill:none;stroke:var(--color-neutral-300);stroke-width:9;stroke-linecap:round;}
.gauge .prg{fill:none;stroke-width:9;stroke-linecap:round;stroke:var(--color-accent-2);
  transition:stroke-dashoffset 1.1s var(--ease);}
.gc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;}
.gc .v{font-family:var(--font-heading);font-size:30px;line-height:1;color:var(--color-accent-2-700);font-variant-numeric:tabular-nums;}
.gc .v small{font-size:15px;}
.gc .l{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-600);margin-top:3px;font-weight:700;}
.mside{flex:1;min-width:0;}
.hlabel{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--color-neutral-600);}
.hamt{font-family:var(--font-heading);font-size:34px;line-height:1;color:var(--color-accent-700);margin-top:5px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;}
.hamt.ok{color:var(--color-accent-2-700);font-size:27px;}
.hamt small{font-size:17px;margin-right:3px;}
.hsub{font-size:11.5px;color:var(--color-neutral-700);margin-top:5px;}
.hsplit{display:flex;height:9px;border-radius:999px;overflow:hidden;background:var(--color-neutral-300);margin-top:var(--space-3);}
.hsplit i{display:block;height:100%;transition:width 1s var(--ease);}
.hstats{display:flex;gap:var(--space-2);margin-top:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--color-divider);}
.hstat{flex:1;min-width:0;}
.hstat span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600);font-weight:700;}
.hstat b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hstat b.g{color:var(--color-accent-2-800);} .hstat b.r{color:var(--color-alert);}

/* ─── filter chips ──────────────────────────────────────── */
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:var(--space-4) calc(var(--space-4) * -1) 0;
  padding:0 var(--space-4) 2px;}
.chips::-webkit-scrollbar{display:none;}
.chipf{flex:none;height:34px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--color-divider);color:var(--color-neutral-700);
  transition:background .2s,color .2s,border-color .2s;}
.chipf em{font-style:normal;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:99px;
  display:inline-grid;place-items:center;padding:0 6px;background:var(--color-surface);color:var(--color-neutral-700);}
.chipf.on{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-bg);}
.chipf.on em{background:color-mix(in srgb,var(--color-bg) 25%,transparent);color:var(--color-bg);}

/* ─── needs attention ───────────────────────────────────── */
.odue{display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--space-4) * -1);padding:0 var(--space-4) 4px;}
.odue::-webkit-scrollbar{display:none;}
.ocard{flex:none;width:196px;background:var(--color-alert-100);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);text-align:left;}
.ocard small{display:block;font-size:9.5px;color:var(--color-alert-700);font-weight:700;letter-spacing:.1em;}
.ocard b{display:block;font-size:13.5px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ocard span{display:block;font-size:11px;color:var(--color-neutral-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ocard .oa{font-family:var(--font-heading);font-size:21px;margin-top:6px;color:var(--color-alert-700);font-variant-numeric:tabular-nums;}

/* ─── insight strips ────────────────────────────────────── */
.alert{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3) var(--space-4);
  border-radius:var(--radius-lg);background:var(--color-surface);margin-bottom:var(--space-2);}
.alert .ai{width:30px;height:30px;border-radius:999px;flex:none;display:grid;place-items:center;background:var(--color-bg);}
.alert.warn{background:var(--color-accent-100);} .alert.warn .ai{box-shadow:inset 0 0 0 1.5px var(--color-accent);color:var(--color-accent-700);}
.alert.info{background:var(--color-accent-2-100);} .alert.info .ai{box-shadow:inset 0 0 0 1.5px var(--color-accent-2);color:var(--color-accent-2-700);}
.alert .at{flex:1;min-width:0;}
.alert .at b{display:block;font-size:13px;font-weight:700;line-height:1.3;}
.alert .at span{display:block;font-size:11.5px;color:var(--color-neutral-700);margin-top:3px;line-height:1.5;}
.alert .at button{margin-top:5px;font-size:11.5px;font-weight:700;color:var(--color-accent-700);
  text-decoration:underline;text-underline-offset:2px;}

/* ─── property card (home) ──────────────────────────────── */
.phead{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;}
.ring{width:46px;height:46px;flex:none;position:relative;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block;}
.ring .trk{fill:none;stroke:var(--color-neutral-300);stroke-width:4;}
.ring .prg{fill:none;stroke:var(--color-accent-2);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease);}
.ring .prg.late{stroke:var(--color-alert);} .ring .prg.due{stroke:var(--color-accent);}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-heading);font-size:14px;}
.av{width:46px;height:46px;border-radius:999px;flex:none;display:grid;place-items:center;
  font-family:var(--font-heading);font-size:16px;color:var(--color-bg);box-shadow:var(--shadow-sm);}
.av.c0{background:linear-gradient(140deg,var(--color-accent-400),var(--color-accent-700));}
.av.c1{background:linear-gradient(140deg,var(--color-accent-2-400),var(--color-accent-2-700));}
.av.c2{background:linear-gradient(140deg,#e0b65a,#94681a);}
.av.c3{background:linear-gradient(140deg,#86b0b0,#3f6b6c);}
.av.c4{background:linear-gradient(140deg,#d98a6a,#8a3d24);}
.pinfo{flex:1;min-width:0;}
.pinfo b{display:block;font-family:var(--font-heading);font-weight:400;font-size:18px;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pinfo span{display:block;font-size:11.5px;color:var(--color-neutral-700);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pinfo span strong{color:var(--color-text);font-weight:700;}
.items{margin-top:var(--space-2);}
.irow{display:flex;align-items:center;gap:var(--space-3);padding:8px var(--space-2);margin:0 calc(var(--space-2) * -1);
  border-radius:var(--radius-md);cursor:pointer;}
.irow + .irow{border-top:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);border-radius:0;}
.irow:active{background:color-mix(in srgb,var(--color-text) 8%,transparent);}
.kic{width:34px;height:34px;border-radius:999px;flex:none;display:grid;place-items:center;}
.kic.rent{background:var(--k-rent-bg);color:var(--k-rent-fg);}
.kic.electric{background:var(--k-elec-bg);color:var(--k-elec-fg);}
.kic.gas{background:var(--k-gas-bg);color:var(--k-gas-fg);}
.kic.water{background:var(--k-water-bg);color:var(--k-water-fg);}
.imid{flex:1;min-width:0;}
.imid b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.imid span{display:block;font-size:11px;color:var(--color-neutral-600);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.imid span.late{color:var(--color-alert);font-weight:600;}
.iamt{text-align:right;flex:none;}
.iamt b{display:block;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;}
.iamt b.no{color:var(--color-neutral-500);font-weight:400;}
.iamt b.paid{color:var(--color-neutral-700);}
.iamt span{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:1px;}
.iamt span.due{color:var(--color-accent-700);} .iamt span.late{color:var(--color-alert);}
.iamt span.ok{color:var(--color-accent-2-700);} .iamt span.none{color:var(--color-neutral-500);}
.tick{width:32px;height:32px;border-radius:999px;flex:none;display:grid;place-items:center;
  background:var(--color-bg);color:var(--color-neutral-400);transition:background .22s,color .22s,transform .15s;}
.tick.rent{background:var(--k-rent-bg);color:var(--k-rent-fg);}
.tick.electric{background:var(--k-elec-bg);color:var(--k-elec-fg);}
.tick.gas{background:var(--k-gas-bg);color:var(--k-gas-fg);}
.tick.water{background:var(--k-water-bg);color:var(--k-water-fg);}
.tick.on{background:var(--color-accent-2);color:var(--color-bg);box-shadow:0 3px 8px -3px color-mix(in srgb,var(--color-accent-2) 80%,transparent);}
.tick:active{transform:scale(.88);}
.tick.pop{animation:pop .45s var(--ease);}
@keyframes pop{0%{transform:scale(.7);}55%{transform:scale(1.15);}100%{transform:scale(1);}}
.tick.pop::after{content:'';position:absolute;}

.refs{margin-top:var(--space-3);padding-top:var(--space-2);border-top:1px solid var(--color-divider);animation:pin .3s var(--ease);}
.ref{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) 0;}
.ref + .ref{border-top:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);}
.ref .rl{flex:1;min-width:0;}
.ref .rl small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-600);font-weight:700;}
.ref .rl b{display:block;font-size:14px;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums;
  color:var(--color-accent-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ref .rl b.no{color:var(--color-neutral-500);font-weight:400;letter-spacing:0;font-size:12.5px;}
.mini{border:1px solid var(--color-divider);border-radius:999px;padding:4px 11px;font-size:10px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);flex:none;text-decoration:none;
  display:inline-flex;align-items:center;gap:5px;}
.mini:active{background:var(--color-accent);color:var(--color-bg);border-color:var(--color-accent);}

.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--color-divider);}
.act{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:1px solid var(--color-divider);
  border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700;color:var(--color-neutral-700);}
.act:active{background:var(--color-accent);color:var(--color-bg);border-color:var(--color-accent);}
.act.wa{background:var(--color-accent-2-100);color:var(--color-accent-2-800);border-color:color-mix(in srgb,var(--color-accent-2) 40%,transparent);}
.act.hot{background:var(--color-accent-100);color:var(--color-accent-800);border-color:color-mix(in srgb,var(--color-accent) 40%,transparent);}
.act.sp{margin-left:auto;}
.act.ic{padding:5px 8px;}
.pmeter{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-3);}
.pmeter .bar{flex:1;height:7px;border-radius:999px;background:var(--color-neutral-300);overflow:hidden;}
.pmeter .bar i{display:block;height:100%;border-radius:999px;background:var(--color-accent-2);transition:width .9s var(--ease);}
.pmeter span{font-size:10.5px;color:var(--color-neutral-600);font-weight:700;font-variant-numeric:tabular-nums;}

/* ─── search / tools ────────────────────────────────────── */
.search{position:relative;margin-bottom:var(--space-2);}
.search input{width:100%;min-height:46px;border-radius:999px;background:var(--color-surface);border:1px solid transparent;
  padding:10px 16px 10px 44px;font-size:15px;font-weight:600;}
.search input::placeholder{color:var(--color-neutral-500);font-weight:400;}
.search input:focus{border-color:var(--color-accent);}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--color-neutral-600);}
.tools{display:flex;gap:var(--space-2);align-items:center;margin-bottom:var(--space-3);}
.segm{display:flex;border:1px solid var(--color-divider);border-radius:999px;overflow:hidden;flex:1;}
.segm button{flex:1;padding:8px;font-size:12.5px;font-weight:600;transition:background .2s,color .2s;}
.segm button + button{border-left:1px solid var(--color-divider);}
.segm button.on{background:var(--color-accent);color:var(--color-bg);}
.sortbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-divider);border-radius:999px;
  padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--color-neutral-700);flex:none;}

/* ─── stats tiles ───────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-bottom:var(--space-3);}
.tiles.three{grid-template-columns:repeat(3,1fr);}
.tile{background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);min-width:0;}
.tile span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600);font-weight:700;}
.tile b{display:block;font-family:var(--font-heading);font-weight:400;font-size:20px;margin-top:5px;line-height:1.05;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile b.g{color:var(--color-accent-2-700);} .tile b.r{color:var(--color-alert);} .tile b.a{color:var(--color-accent-700);}
.tile b span{display:inline;font-size:inherit;letter-spacing:inherit;text-transform:none;color:inherit;font-weight:inherit;}
.tile small{display:block;font-size:10.5px;color:var(--color-neutral-600);margin-top:2px;}
.tile.hot{background:linear-gradient(140deg,color-mix(in srgb,var(--color-accent) 22%,var(--color-surface)) 0%,var(--color-surface) 70%);}

/* properties list */
.pgrid{display:flex;gap:var(--space-2);margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--color-divider);}
.pgrid div{flex:1;min-width:0;}
.pgrid span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600);font-weight:700;}
.pgrid b{display:block;font-size:15px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chev{color:var(--color-neutral-500);flex:none;display:grid;place-items:center;}

/* ─── charts ────────────────────────────────────────────── */
.ctitle{display:flex;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-2);}
.ctitle h3{font-size:18px;}
.ctitle .r{margin-left:auto;font-size:11px;color:var(--color-neutral-600);font-weight:600;}
.ctitle .big{font-family:var(--font-heading);font-size:26px;line-height:1;color:var(--color-accent-700);}
.lchart{position:relative;margin:var(--space-2) -4px 0;}
.lchart svg{display:block;width:100%;height:auto;overflow:visible;}
.lchart .grid{stroke:color-mix(in srgb,var(--color-text) 9%,transparent);stroke-width:1;stroke-dasharray:3 4;}
.lchart .area{fill:url(#lg1);}
.lchart .area2{fill:url(#lg2);}
.lchart .line{fill:none;stroke:var(--color-accent-2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.lchart .line2{fill:none;stroke:var(--color-accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 5;}
.lchart .dot{fill:var(--color-surface);stroke:var(--color-accent-2);stroke-width:2.5;}
.lchart .dot.cur{fill:var(--color-accent-2);r:5.5;}
.lchart .lab{font-size:9px;fill:var(--color-neutral-600);font-weight:700;font-family:var(--font-body);}
.lchart .tipv{font-size:10.5px;fill:var(--color-accent-2-800);font-weight:700;font-family:var(--font-body);}
.anim .lchart .line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s var(--ease) .15s forwards;}
.anim .lchart .area,.anim .lchart .area2{opacity:0;animation:fadein .9s ease .7s forwards;}
.anim .lchart .dot,.anim .lchart .tipv{opacity:0;animation:fadein .4s ease 1.2s forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes fadein{to{opacity:1;}}

.bars{display:flex;align-items:flex-end;gap:4px;padding-top:var(--space-2);}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
.bwrap{width:100%;height:96px;display:flex;align-items:flex-end;gap:2px;}
.bar{flex:1;border-radius:999px 999px var(--radius-sm) var(--radius-sm);min-height:3px;transform-origin:bottom;}
.bar.p{background:var(--color-accent-2);} .bar.o{background:var(--color-accent);}
.anim .bar{animation:grow .9s var(--ease) both;}
@keyframes grow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
.blab{font-size:8.5px;color:var(--color-neutral-600);font-weight:700;}
.bcol.cur .blab{color:var(--color-accent-700);}
.plegend{display:flex;gap:var(--space-3);flex-wrap:wrap;font-size:10.5px;color:var(--color-neutral-700);margin-top:var(--space-3);}
.plegend b{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:5px;}

.donut{display:flex;align-items:center;gap:var(--space-4);}
.donut .dw{width:132px;height:132px;flex:none;position:relative;}
.donut svg{width:100%;height:100%;transform:rotate(-90deg);display:block;}
.donut .seg{fill:none;stroke-width:15;transition:stroke-dashoffset 1.2s var(--ease);}
.donut .dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;}
.donut .dc b{font-family:var(--font-heading);font-weight:400;font-size:19px;line-height:1;}
.donut .dc span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600);font-weight:700;margin-top:4px;}
.dleg{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
.dleg div{display:flex;align-items:center;gap:8px;font-size:12px;}
.dleg i{width:9px;height:9px;border-radius:999px;flex:none;}
.dleg span{flex:1;color:var(--color-neutral-700);}
.dleg b{font-weight:700;font-variant-numeric:tabular-nums;}

.hm{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) 0;}
.hm + .hm{border-top:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);}
.hm .hn{width:92px;flex:none;min-width:0;}
.hm .hn b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hm .hn span{display:block;font-size:10.5px;color:var(--color-neutral-600);}
.hm .cells{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:3px;}
.hm .cells i{height:22px;border-radius:var(--radius-sm);background:var(--color-neutral-300);display:block;}
.hm .cells i.all{background:var(--color-accent-2);}
.hm .cells i.some{background:var(--color-accent-400);}
.hm .cells i.nil{background:var(--color-alert);}
.anim .hm .cells i{animation:popin .5s var(--ease) both;}
@keyframes popin{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:none;}}
.hmhead{display:flex;gap:var(--space-2);}
.hmhead .sp{width:92px;flex:none;}
.hmhead .ms{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:3px;}
.hmhead .ms span{font-size:8.5px;color:var(--color-neutral-600);font-weight:700;text-align:center;}

/* ─── settings ──────────────────────────────────────────── */
.group{background:var(--color-surface);border-radius:calc(var(--radius-lg) * 1.15);padding:var(--space-1) var(--space-4);
  margin-bottom:var(--space-2);box-shadow:var(--shadow-sm);}
.glabel{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--color-neutral-600);font-weight:700;
  margin:var(--space-6) var(--space-2) var(--space-2);}
.gnote{font-size:11px;color:var(--color-neutral-600);margin:0 var(--space-2) var(--space-2);line-height:1.5;}
.srow{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;padding:var(--space-3) 0;font-size:14px;
  border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);}
.srow:last-child{border-bottom:none;}
button.srow:active{opacity:.6;}
.sic{width:32px;height:32px;border-radius:999px;flex:none;display:grid;place-items:center;background:var(--color-bg);color:var(--color-accent-700);}
.sic.g{color:var(--color-accent-2-700);} .sic.r{color:var(--color-alert);background:var(--color-alert-100);}
.sic.b{color:var(--k-water-fg);} .sic.a{color:var(--k-gas-fg);}
.stx{flex:1;min-width:0;}
.stx b{display:block;font-weight:700;font-size:13.5px;}
.stx span{display:block;font-size:11px;color:var(--color-neutral-600);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sval{font-size:12.5px;color:var(--color-text);font-weight:600;flex:none;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.srow.danger .stx b{color:var(--color-alert);}
.profile{border-bottom:none;padding:var(--space-3) 0;}
.profile .av{width:58px;height:58px;font-size:23px;}
.profile .stx b{font-family:var(--font-heading);font-weight:400;font-size:21px;line-height:1.1;}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);padding:var(--space-3) 0;}
.themes button{border-radius:var(--radius-lg);border:1.5px solid var(--color-divider);padding:8px;text-align:center;
  font-size:12px;font-weight:700;color:var(--color-neutral-700);transition:border-color .2s;}
.themes button.on{border-color:var(--color-accent);color:var(--color-accent-700);}
.themes .sw{height:40px;border-radius:999px;margin-bottom:6px;display:flex;overflow:hidden;}
.themes .sw i{flex:1;}
.verfoot{text-align:center;font-size:10.5px;color:var(--color-neutral-600);line-height:1.7;margin-top:var(--space-6);}
.foot{text-align:center;font-size:10.5px;color:var(--color-neutral-600);line-height:1.7;margin-top:var(--space-4);padding:0 var(--space-4);}

/* ─── empty ─────────────────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--space-8) var(--space-4) var(--space-6);}
.empty .ei{width:84px;height:84px;border-radius:999px;display:grid;place-items:center;color:var(--color-bg);
  background:linear-gradient(140deg,var(--color-accent-400),var(--color-accent-700));box-shadow:var(--shadow-md);margin-bottom:var(--space-4);}
.empty h3{font-size:26px;line-height:1.15;}
.empty p{font-size:13px;color:var(--color-neutral-700);line-height:1.6;margin:var(--space-2) 0 var(--space-6);max-width:280px;}
.steps{display:flex;flex-direction:column;gap:var(--space-3);width:100%;margin-top:var(--space-6);padding-top:var(--space-4);
  border-top:1px solid var(--color-divider);text-align:left;}
.steps div{display:flex;gap:var(--space-3);align-items:flex-start;}
.steps i{width:22px;height:22px;border-radius:999px;flex:none;display:grid;place-items:center;background:var(--color-bg);
  color:var(--color-accent-700);font-style:normal;font-size:11px;font-weight:800;}
.steps p{margin:0;font-size:12px;color:var(--color-neutral-700);line-height:1.5;max-width:none;}
.steps b{color:var(--color-text);}
.nores{text-align:center;color:var(--color-neutral-600);font-size:13px;padding:var(--space-8) var(--space-4);}

/* ─── buttons ───────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;width:100%;
  font-family:var(--font-heading);font-weight:400;font-size:15px;line-height:1.2;
  padding:var(--space-3) calc(var(--space-3) * 1.2);border-radius:999px;border:1px solid transparent;transition:transform .12s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--color-accent);color:var(--color-bg);}
.btn-primary:active{background:var(--color-accent-700);}
.btn-dark,.btn-ghost{border-color:var(--color-divider);}
.btn-dark:active,.btn-ghost:active{background:color-mix(in srgb,var(--color-text) 14%,transparent);}
.btn-danger{background:var(--color-alert-100);color:var(--color-alert-700);}
.btn[disabled]{opacity:.42;pointer-events:none;}
.btn + .btn{margin-top:var(--space-2);}
.brow{display:flex;gap:var(--space-2);margin-top:var(--space-4);}
.brow .btn{margin-top:0;}
.brow .btn:first-child{flex:0 0 38%;}
.brow .btn:last-child{flex:1;}

/* ─── FAB + tab bar ─────────────────────────────────────── */
.fab{position:fixed;right:calc(50% - 220px + var(--space-4));bottom:calc(var(--bar-h) + var(--sab) + var(--space-4));z-index:60;
  width:58px;height:58px;border-radius:999px;display:grid;place-items:center;
  background:var(--color-accent);color:var(--color-bg);box-shadow:var(--shadow-lg);transition:transform .18s;
  animation:fabin .5s var(--ease);}
.fab:active{transform:scale(.9);background:var(--color-accent-700);}
@keyframes fabin{from{transform:scale(0) rotate(-90deg);}to{transform:none;}}
@media(max-width:472px){.fab{right:var(--space-4);}}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);z-index:70;
  height:calc(var(--bar-h) + var(--sab));padding-bottom:var(--sab);
  background:color-mix(in srgb,var(--color-surface) 93%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:var(--shadow-md);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--color-neutral-600);transition:color .2s;position:relative;}
.tab.on{color:var(--color-accent-700);}
.tab span{font-size:10px;font-weight:700;}
.tab svg{transition:transform .25s var(--ease);}
.tab.on svg{transform:translateY(-1px) scale(1.08);}

/* ─── sheet ─────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--color-neutral-900) 50%,transparent);
  opacity:0;transition:opacity .28s;}
.scrim.on{opacity:1;}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(102%);width:min(440px,100%);z-index:90;
  background:var(--color-surface);border-radius:calc(var(--radius-lg) * 1.4) calc(var(--radius-lg) * 1.4) 0 0;
  padding:var(--space-2) var(--space-4) calc(var(--space-6) + var(--sab));transition:transform .38s var(--ease);
  box-shadow:var(--shadow-lg);max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;}
.sheet.on{transform:translateX(-50%) translateY(0);}
.grab{width:40px;height:4px;border-radius:999px;background:var(--color-neutral-400);margin:0 auto var(--space-4);}
.sheet h3{font-size:24px;margin-bottom:var(--space-1);}
.sheet .eyb{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--color-accent-700);margin-bottom:var(--space-2);}
.sheet .ssub{font-size:13px;color:var(--color-neutral-700);margin:0 0 var(--space-6);line-height:1.5;}
.sheet .shd{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);}
.sheet .shd .kic{width:48px;height:48px;}
.sheet .shd .av{width:52px;height:52px;font-size:19px;}
.sheet .shd h3{margin:0;}
.sheet .shd small{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--color-accent-700);margin-bottom:3px;}
.wprog{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--color-neutral-300);margin-bottom:var(--space-4);gap:0;}
.wprog i{flex:1;height:100%;}
.wprog i.on{background:var(--color-accent);}
.skip{width:100%;text-align:center;font-size:12px;font-weight:600;color:var(--color-neutral-600);padding:var(--space-4) 0 0;}

.field{margin-bottom:var(--space-3);}
.field > label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:6px;color:var(--color-neutral-700);}
.input{width:100%;min-height:46px;padding:10px 16px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--color-text);caret-color:var(--color-accent);background:var(--color-bg);border:1px solid var(--color-divider);border-radius:999px;}
.input::placeholder{font-weight:400;color:var(--color-neutral-500);}
.input:focus{border-color:var(--color-accent);}
.money{position:relative;}
.money span{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-family:var(--font-heading);font-size:20px;color:var(--color-neutral-600);}
.money .input{font-family:var(--font-heading);font-weight:400;font-size:27px;min-height:60px;padding:10px 20px 10px 54px;}
select.input{background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2382796a' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 16px center;background-size:16px;padding-right:44px;font-size:14px;}
textarea.input{border-radius:var(--radius-md);min-height:110px;font-size:13px;font-weight:400;resize:vertical;line-height:1.5;}
.hint{font-size:10.5px;color:var(--color-neutral-600);margin-top:5px;padding-left:14px;line-height:1.5;}
.paidbox{display:flex;align-items:center;gap:var(--space-3);width:100%;background:var(--color-bg);border-radius:999px;
  padding:7px 18px 7px 7px;margin-bottom:var(--space-3);cursor:pointer;border:1px solid transparent;transition:background .2s;}
.paidbox b{flex:1;font-size:14px;font-weight:700;}
.paidbox.on{background:var(--color-accent-2-100);border-color:color-mix(in srgb,var(--color-accent-2) 40%,transparent);}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--space-2);}
.quick button{border:1px solid var(--color-divider);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700;color:var(--color-neutral-700);}
.quick button:active{background:var(--color-accent);color:var(--color-bg);border-color:var(--color-accent);}
.more{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--color-accent-700);padding:var(--space-2) 0;}
.pick{display:flex;flex-direction:column;gap:var(--space-2);}
.pick button{display:flex;align-items:center;gap:var(--space-3);text-align:left;padding:var(--space-4);border-radius:var(--radius-lg);
  background:var(--color-bg);border:1px solid var(--color-divider);}
.pick button:active{border-color:var(--color-accent);background:var(--color-accent-100);}
.pick b{display:block;font-family:var(--font-heading);font-weight:400;font-size:17px;line-height:1.15;}
.pick span span{display:block;font-size:11.5px;color:var(--color-neutral-700);margin-top:4px;}
.ktype{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);}
.ktype button{border-radius:var(--radius-lg);border:1px solid var(--color-divider);background:var(--color-bg);padding:10px 6px;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--color-neutral-700);}
.ktype button.on{border-color:var(--color-accent);background:var(--color-accent-100);color:var(--color-accent-800);}
.dsec{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--color-accent-700);margin:var(--space-6) 0 var(--space-1);}
.dlist .srow{min-height:54px;}
.addm{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:var(--space-3);
  border:1px dashed color-mix(in srgb,var(--color-text) 26%,transparent);border-radius:999px;padding:11px;
  font-size:13px;font-weight:700;color:var(--color-neutral-700);}
.addm:active{border-color:var(--color-accent);color:var(--color-accent-700);background:var(--color-accent-100);}
.sortlist button{display:flex;align-items:center;gap:var(--space-3);width:100%;padding:var(--space-3) 0;font-size:14px;font-weight:700;
  border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);color:var(--color-text);}
.sortlist button svg:first-child{color:var(--color-accent-700);}
.sortlist button:last-child{border-bottom:none;}
.sortlist button i{margin-left:auto;color:var(--color-accent-2-700);font-style:normal;}

/* ─── toast ─────────────────────────────────────────────── */
.toast{position:fixed;bottom:calc(var(--bar-h) + var(--sab) + var(--space-6));left:50%;
  transform:translateX(-50%) translateY(16px);z-index:100;background:var(--color-neutral-900);color:var(--color-neutral-100);
  border-radius:999px;padding:9px 20px 9px 9px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .3s var(--ease);box-shadow:var(--shadow-lg);white-space:nowrap;
  display:flex;align-items:center;gap:var(--space-2);max-width:calc(100% - 32px);}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.toast i{width:22px;height:22px;border-radius:999px;background:var(--color-accent-2);color:var(--color-neutral-100);display:grid;place-items:center;flex:none;}
.toast button{color:var(--color-accent-400);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 4px;margin-left:4px;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;}
}

function kindIcon(kind){ return kind==="rent"?"rent":KINDS[kind].icon; }

/* ═══════════════════ storage ═══════════════════ */
function readStore(){ try{ var r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }
  catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(D)); }
  catch(e){ toast("Could not save. Browser storage is blocked."); } }

/* ═══════════════════ dates and money ═══════════════════ */
function pad(n){ n=String(n); return n.length<2?"0"+n:n; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function nowM(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function mShift(mk,n){ var p=mk.split("-"),y=+p[0],m=+p[1]-1+n;
  y+=Math.floor(m/12); m=((m%12)+12)%12; return y+"-"+pad(m+1); }
function mName(mk){ var p=mk.split("-"); return FULLMON[+p[1]-1]+" "+p[0]; }
function mOnly(mk){ return FULLMON[+mk.split("-")[1]-1]; }
function dShort(iso){ if(!iso) return ""; var p=iso.split("-"); return String(+p[2])+" "+MON[+p[1]-1]; }
function dLong(iso){ if(!iso) return ""; var p=iso.split("-"); return String(+p[2])+" "+MON[+p[1]-1]+" "+p[0]; }
function ord(n){ n=+n||1; var s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
var NF; try{ NF=new Intl.NumberFormat("en-US",{maximumFractionDigits:0}); }
catch(e){ NF={format:function(n){return String(n);}}; }
function num(n){ return NF.format(Math.round(+n||0)); }
function rs(n){ return "Rs "+num(n); }
function rsK(n){ n=Math.round(+n||0);
  if(Math.abs(n)>=100000) return "Rs "+(n/100000).toFixed(n%100000===0?0:1)+" lac";
  if(Math.abs(n)>=10000) return "Rs "+(n/1000).toFixed(0)+"k";
  return rs(n); }

/* ═══════════════════ helpers ═══════════════════ */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")

function uid(p){ return (p||"h")+Math.random().toString(36).slice(2,9); }
function blank(){ return {amount:"",due:"",paid:false,paidOn:"",note:""}; }
function getP(o,p){ var a=p.split("."),v=o;
  for(var i=0;i<a.length;i++){ if(v==null) return ""; v=v[a[i]]; } return v==null?"":v; }
function setP(o,p,val){ var a=p.split("."),v=o;

  return (w[0].charAt(0)+(w[1]?w[1].charAt(0):"")).toUpperCase();
}
function avc(id){ var h=0,s=String(id||""); for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0;
  return "c"+(Math.abs(h)%5); }
function plural(n,a,b){ return n+" "+(n===1?a:(b||a+"s")); }

function provOf(kind,name){
  var list=KINDS[kind].providers;
  for(var i=0;i<list.length;i++) if(list[i].n===name) return list[i];
  return list[0];
}
function newMeter(kind,provName){
  var p=provOf(kind,provName);
  return {id:uid("m"), kind:kind, prov:p.n, url:p.u, ref:"", label:""};
}
function emptyHouse(){
  return {id:uid(), name:"", addr:"", type:"rent", rentDay:+SET().defDay||5, added:Date.now(),

    meters:[newMeter("electric",SET().defElec||"MEPCO"), newMeter("gas","SNGPL"), newMeter("water","WASA")]};
}
function houseById(id){ for(var i=0;i<D.houses.length;i++) if(D.houses[i].id===id) return D.houses[i]; return null; }
function meterById(h,id){ var m=h.meters||[];
  for(var i=0;i<m.length;i++) if(m[i].id===id) return m[i]; return null; }

function meterName(h,m){
  var base=m.prov||KINDS[m.kind].name;
  if(m.label) return base+" · "+m.label;
  var peers=(h.meters||[]).filter(function(x){
    return x.kind===m.kind && (x.prov||"")===(m.prov||"") && !x.label; });
  if(peers.length>1){
    var tail=m.ref ? String(m.ref).replace(/\s+/g,"").slice(-4) : "#"+(peers.indexOf(m)+1);
    return base+" · "+tail;
  }
  return base;
}
function itemsOf(h){
  var out=[];
  if(h.type!=="own") out.push({key:"rent", kind:"rent", name:"Rent", icon:"rent"});
  (h.meters||[]).forEach(function(m){
    out.push({key:m.id, kind:m.kind, name:meterName(h,m), icon:KINDS[m.kind].icon, meter:m});
  });
  return out;
}
function itemOf(h,key){ var a=itemsOf(h); for(var i=0;i<a.length;i++) if(a[i].key===key) return a[i]; return null; }

function peek(mk,hid){
  var src=(D.entries[mk]||{})[hid]||{}, out={};
  for(var k in src){
    if(!Object.prototype.hasOwnProperty.call(src,k)) continue;
    var it=src[k]||{};
    out[k]={amount:it.amount==null?"":it.amount, due:it.due||"", paid:!!it.paid,
            paidOn:it.paidOn||"", note:it.note||""};
  }
  return out;
}
function pick(rec,key){ return rec[key]||blank(); }
function ensure(mk,hid,key){
  if(!D.entries[mk]) D.entries[mk]={};
  if(!D.entries[mk][hid]) D.entries[mk][hid]={};
  var r=D.entries[mk][hid];
  if(!r[key]) r[key]=blank();
  return r[key];
}
function startMonth(h){
  var a=[];
  var sn=getP(h,"tenant.since"); if(sn && /^\d{4}-\d{2}/.test(sn)) a.push(sn.slice(0,7));
  if(+h.added>1e11){ var d=new Date(+h.added); a.push(d.getFullYear()+"-"+pad(d.getMonth()+1)); }
  return a.sort().pop()||"";
}
function amtOf(h,item,it,mk){
  if(it.amount!=="" && it.amount!=null) return +it.amount||0;
  if(item.key==="rent"){ if(mk && mk<startMonth(h)) return 0; return +getP(h,"tenant.rent")||0; }
  return 0;
}
function dueOf(h,item,it,mk){
  if(item.key==="rent") return mk+"-"+pad(Math.min(28,Math.max(1,+h.rentDay||5)));
  return it.due||"";
}
function statOf(h,item,it,mk){
  if(it.paid) return "paid";
  if(!amtOf(h,item,it,mk)) return "none";
  var d=dueOf(h,item,it,mk);
  return (d && today()>d) ? "late" : "due";
}
function houseMonth(h,mk){
  var e=peek(mk,h.id), r={owed:0,done:0,late:0,lateAmt:0,nItems:0,nPaid:0,rows:[]};
  itemsOf(h).forEach(function(item){
    var it=pick(e,item.key), s=statOf(h,item,it,mk), a=amtOf(h,item,it,mk);
    r.rows.push({item:item,it:it,s:s,a:a,d:dueOf(h,item,it,mk)});
    if(s!=="none") r.nItems++;
    if(s==="paid"){ r.done+=a; r.nPaid++; }
    else if(s==="due"||s==="late"){ r.owed+=a; if(s==="late"){ r.late++; r.lateAmt+=a; } }
  });
  return r;
}
function monthTotals(mk){
  var t={owed:0,done:0,nOwed:0,nDone:0,late:0,lateAmt:0,byKind:{rent:0,electric:0,gas:0,water:0}};
  D.houses.forEach(function(h){
    var r=houseMonth(h,mk);
    r.rows.forEach(function(x){
      if(x.s==="paid"){ t.done+=x.a; t.nDone++; }
      else if(x.s==="due"||x.s==="late"){ t.owed+=x.a; t.nOwed++; }
      if(x.s==="late"){ t.late++; t.lateAmt+=x.a; }
      if(x.s!=="none") t.byKind[x.item.kind]=(t.byKind[x.item.kind]||0)+x.a;
    });
  });
  t.total=t.owed+t.done;
  return t;
}
function SET(){ return (D && D.settings) || DEF_SETTINGS; }
function fillTpl(tpl,h,amount,mk){
  var s=String(tpl||"")
    .replace(/\{tenant\}/g, getP(h,"tenant.name")||"")
    .replace(/\{amount\}/g, rs(amount))
    .replace(/\{month\}/g, mName(mk))
    .replace(/\{property\}/g, h.name||"")
    .replace(/\{owner\}/g, SET().owner||"");
  return s.replace(/\s*[—-]\s*$/,"").replace(/\s{2,}/g," ").replace(/ ,/g,",").trim();
}
function waNum(p){ var dg=String(p||"").replace(/\D/g,""); if(dg.charAt(0)==="0") dg="92"+dg.slice(1); return dg; }

/* ═══════════════════ migration ═══════════════════ */
function migrate(d){
  if(!d || !d.houses) return d;
  if(!(d.v>=2)){
    var PMAP={"LESCO / MEPCO / GEPCO / FESCO / IESCO":"MEPCO","K-Electric":"K-Electric",
              "SNGPL":"SNGPL","SSGC":"SSGC","WASA / Water Board":"WASA"};
    var KMAP={bijli:"electric", gas:"gas", pani:"water"};
    var DEF={electric:"MEPCO", gas:"SNGPL", water:"WASA"};
    d.houses.forEach(function(h){
      if(h.meters) return;
      var u=h.utils||{}, ms=[];
      ["bijli","gas","pani"].forEach(function(old){
        var src=u[old]||{}, kind=KMAP[old];
        var m=newMeter(kind, PMAP[src.prov]||DEF[kind]);
        m.id="m_"+old+"_"+h.id; m.ref=src.ref||""; if(src.url) m.url=src.url;
        ms.push(m);
      });
      h.meters=ms; delete h.utils;
    });
    var ents=d.entries||{};
    Object.keys(ents).forEach(function(mk){
      var mo=ents[mk]||{};
      Object.keys(mo).forEach(function(hid){
        var rec=mo[hid]||{}, out={};
        if(rec.rent) out.rent=rec.rent;
        ["bijli","gas","pani"].forEach(function(old){ if(rec[old]) out["m_"+old+"_"+hid]=rec[old]; });
        mo[hid]=out;
      });
    });
  }
  var s=d.settings||{};
  for(var k in DEF_SETTINGS) if(s[k]==null) s[k]=DEF_SETTINGS[k];
  d.settings=s;
  d.houses.forEach(function(h,i){ if(!h.added) h.added=i+1; if(!h.meters) h.meters=[]; if(!h.tenant) h.tenant={}; });
  if(!d.entries) d.entries={};
  d.v=VERSION;
  return d;
}

/* ═══════════════════ toast and clipboard ═══════════════════ */
var tT,tEl,tUndo=null;
function toast(m,undo){
  if(!tEl){ tEl=document.createElement("div"); tEl.className="toast"; tEl.setAttribute("role","status");
    document.body.appendChild(tEl);
    tEl.addEventListener("click",function(e){ if(e.target.closest("[data-undo]") && tUndo){ var f=tUndo; tUndo=null; f(); tEl.classList.remove("on"); } }); }
  tUndo=undo||null;
  tEl.innerHTML='<i>'+sv(IC.tick,13,3)+'</i><span>'+esc(m)+'</span>'+(undo?'<button data-undo="1">Undo</button>':'');
  tEl.style.pointerEvents=undo?"auto":"none";
  requestAnimationFrame(function(){ tEl.classList.add("on"); });
  clearTimeout(tT);
  tT=setTimeout(function(){ tEl.classList.remove("on"); tUndo=null; }, undo?4200:2400);
}
function copy(txt,lab){
  function ok(){ toast((lab||"Text")+" copied"); }
  function fb(){
    try{ var t=document.createElement("textarea"); t.value=txt;
      t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t);
      t.select(); document.execCommand("copy"); document.body.removeChild(t); ok();
    }catch(e){ toast("Could not copy"); }
  }
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok,fb); return; } }catch(e){}
  fb();
}
function download(name,text,type){
  try{
    var b=new Blob([text],{type:type||"text/plain"}), u=URL.createObjectURL(b), a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },400);
    toast("Saved "+name);
  }catch(e){ toast("Download not supported here"); }
}

/* ═══════════════════ ordering and filters ═══════════════════ */
function sortedHouses(){
  var hs=D.houses.slice(), s=SET().sort, mk=S.month;
  if(s==="name") hs.sort(function(a,b){ return String(a.name).localeCompare(String(b.name)); });
  else if(s==="rent") hs.sort(function(a,b){ return (+getP(b,"tenant.rent")||0)-(+getP(a,"tenant.rent")||0); });
  else if(s==="due") hs.sort(function(a,b){ return houseMonth(b,mk).owed-houseMonth(a,mk).owed; });
  return hs;
}
function matchQ(h,q){
  if(!q) return true; q=q.toLowerCase();
  var hay=[h.name,h.addr,getP(h,"tenant.name"),getP(h,"tenant.phone")]
    .concat((h.meters||[]).map(function(m){ return m.ref+" "+m.prov+" "+m.label; })).join(" ").toLowerCase();
  return hay.indexOf(q)>=0;
}
function rowPass(s,f){
  if(f==="all") return true;
  if(f==="due") return s==="due"||s==="late";
  if(f==="late") return s==="late";
  if(f==="paid") return s==="paid";
  return true;
}

var GA=188.5, GC=251.33;           /* gauge: 270° of r=40 */
function gauge(p,label,valHTML){
  p=Math.max(0,Math.min(1,p||0));
  return '<div class="gauge"><svg viewBox="0 0 100 100" aria-hidden="true">'+

    '<div class="gc"><div class="v">'+valHTML+'</div><div class="l">'+esc(label)+'</div></div></div>';
}
var RC=125.66;                     /* ring: r=20 */
function ring(p,cls,inner){
  p=Math.max(0,Math.min(1,p||0));
  return '<span class="ring"><svg viewBox="0 0 48 48" aria-hidden="true"><circle class="trk" cx="24" cy="24" r="20"/>'+
    '<circle class="prg '+(cls||"")+'" cx="24" cy="24" r="20" stroke-dasharray="'+RC+'" '+

    '<span>'+inner+'</span></span>';
}
function cnt(n,fmt){       /* number that counts up when the view animates */
  var txt = fmt==="pct" ? Math.round(n)+"" : num(n);
  return '<span class="n" data-count="'+(+n||0)+'" data-fmt="'+(fmt||"num")+'">'+(S.anim?"0":txt)+'</span>';
}
function smoothPath(pts){
  if(pts.length<2) return "";
  var d="M"+pts[0][0].toFixed(1)+","+pts[0][1].toFixed(1);
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2, t=.18;
    var c1x=p1[0]+(p2[0]-p0[0])*t, c1y=p1[1]+(p2[1]-p0[1])*t;
    var c2x=p2[0]-(p3[0]-p1[0])*t, c2y=p2[1]-(p3[1]-p1[1])*t;
    d+=" C"+c1x.toFixed(1)+","+c1y.toFixed(1)+" "+c2x.toFixed(1)+","+c2y.toFixed(1)+" "+p2[0].toFixed(1)+","+p2[1].toFixed(1);
  }
  return d;
}
function easeOut(t){ return 1-Math.pow(1-t,3); }
function runAnims(root){
  /* rings, gauges and donut segments glide from empty to their value */
  var arcs=root.querySelectorAll("[data-off]"), segs=root.querySelectorAll("[data-dash]");
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    for(var i=0;i<arcs.length;i++) arcs[i].setAttribute("stroke-dashoffset",arcs[i].getAttribute("data-off"));
    for(var j=0;j<segs.length;j++) segs[j].setAttribute("stroke-dasharray",segs[j].getAttribute("data-dash"));
  }); });
  /* numbers count up */
  var els=root.querySelectorAll("[data-count]");
  if(!els.length) return;
  var t0=null, dur=1000;
  function step(ts){
    if(t0===null) t0=ts;
    var k=Math.min(1,(ts-t0)/dur), e=easeOut(k);
    for(var i=0;i<els.length;i++){
      var v=(+els[i].getAttribute("data-count"))*e;
      els[i].textContent = els[i].getAttribute("data-fmt")==="pct" ? Math.round(v) : num(v);
    }
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ═══════════════════ views: reports ═══════════════════ */
function lineChart(months,tots){
  var W=320,H=150,pl=6,pr=6,pt=22,pb=22, max=1;
  tots.forEach(function(t){ if(t.total>max) max=t.total; });
  max*=1.08;
  var step=(W-pl-pr)/(months.length-1);
  function pt_(i,v){ return [pl+i*step, pt+(H-pt-pb)*(1-v/max)]; }
  var pc=tots.map(function(t,i){ return pt_(i,t.done); });
  var pb_=tots.map(function(t,i){ return pt_(i,t.total); });
  var lc=smoothPath(pc), lb=smoothPath(pb_);
  var base=H-pb;
  var area=lc+" L"+pc[pc.length-1][0].toFixed(1)+","+base+" L"+pc[0][0].toFixed(1)+","+base+" Z";
  var grid="";
  for(var g=0;g<4;g++){ var y=pt+(H-pt-pb)*g/3; grid+='<line class="grid" x1="0" x2="'+W+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>'; }
  var labs=months.map(function(m,i){
    return '<text class="lab" x="'+(pl+i*step).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle">'+MON[+m.split("-")[1]-1].charAt(0)+'</text>'; }).join("");
  var li=pc.length-1, lp=pc[li];
  var dots=pc.map(function(p,i){ return tots[i].total?'<circle class="dot'+(i===li?' cur':'')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===li?5.5:3)+'"/>':''; }).join("");
  return '<div class="lchart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Collected each month">'+
    '<defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--color-accent-2);stop-opacity:.38"/>'+
      '<stop offset="1" style="stop-color:var(--color-accent-2);stop-opacity:0"/></linearGradient></defs>'+
    grid+'<path class="area" d="'+area+'"/>'+
    '<path class="line2" d="'+lb+'"/>'+
    '<path class="line" d="'+lc+'" pathLength="1"/>'+dots+
    '<text class="tipv" x="'+Math.min(W-4,lp[0]).toFixed(1)+'" y="'+Math.max(10,lp[1]-11).toFixed(1)+'" text-anchor="end">'+esc(rsK(tots[li].done))+'</text>'+
    labs+'</svg></div>';
}
function donut(parts,total,centerTop,centerSub){
  var C=2*Math.PI*52, acc=0, segs="";
  parts.forEach(function(p){
    if(!p.v) return;
    var len=Math.max(0,p.v/total*C-2);
    segs+='<circle class="seg" cx="66" cy="66" r="52" style="stroke:'+p.c+'" '+
      'stroke-dasharray="'+(S.anim?"0 "+C.toFixed(1):len.toFixed(1)+" "+C.toFixed(1))+'" data-dash="'+len.toFixed(1)+" "+C.toFixed(1)+'" '+
      'stroke-dashoffset="'+(-acc).toFixed(1)+'"/>';
    acc+=p.v/total*C;
  });
  return '<div class="dw"><svg viewBox="0 0 132 132" aria-hidden="true">'+
    '<circle cx="66" cy="66" r="52" fill="none" stroke="var(--color-neutral-300)" stroke-width="15"/>'+segs+'</svg>'+
    '<div class="dc"><b>'+centerTop+'</b><span>'+esc(centerSub)+'</span></div></div>';
}

  var bk=cur.byKind, kt=bk.rent+bk.electric+bk.gas+bk.water;
  var parts=[{k:"Rent",v:bk.rent,c:"var(--k-rent)"},{k:"Electricity",v:bk.electric,c:"var(--k-elec)"},
             {k:"Gas",v:bk.gas,c:"var(--k-gas)"},{k:"Water",v:bk.water,c:"var(--k-water)"}];
  o+='<div class="eyebrow">'+esc(mName(nowM()))+' by type</div><div class="card"><div class="donut">'+
    donut(parts,kt||1,esc(rsK(kt)),"this month")+
    '<div class="dleg">'+parts.map(function(p){
      return '<div><i style="background:'+p.c+'"></i><span>'+p.k+'</span><b>'+esc(rsK(p.v))+'</b></div>'; }).join("")+'</div></div></div>';

  o+='<div class="eyebrow">Payment record</div><div class="card">'+

  sortedHouses().forEach(function(h,hi){
    var full=0, seen2=0, cells="";

    });
    o+='<div class="hm"><span class="hn"><b>'+esc(h.name)+'</b><span>'+(seen2?full+' of '+seen2+' months':'No record')+'</span></span>'+
      '<span class="cells">'+cells+'</span></div>';

  o+='<div class="plegend"><span><b style="background:var(--color-accent-2)"></b>All settled</span>'+

    '<span><b style="background:var(--color-alert)"></b>Nothing settled</span>'+
    '<span><b style="background:var(--color-neutral-300)"></b>No record</span></div></div>';

  o+='<button class="btn btn-primary" data-act="csv" style="margin-top:var(--space-2)">'+sv(IC.dl,17,2.2)+'Export all records (CSV)</button>';
  return o;
}

function saveItem(hid,key){

function readField(key,target){
  var el=document.getElementById("fv");
  if(!el) return true;
  var v=el.value.trim();
  if(key.indexOf("meter:")===0){
    var m=target.meters[+key.slice(6)];
    m.ref=v;
    var sel=document.getElementById("fprov");
    if(sel && sel.value){ var p=provOf(m.kind,sel.value); m.prov=p.n; m.url=p.u; }
    return true;
  }
  var d=F[key];
  if(d.req && !v){ toast("This one is required"); el.focus(); return false; }
  if(d.t==="money") v = v===""?"":(+v||0);

function wizSteps(){
  var base=["type","name","tenant.name","tenant.phone","tenant.rent","rentDay"]
    .filter(function(k){ return !(F[k].rentOnly && W.draft.type==="own"); });
  W.draft.meters.forEach(function(m,i){ base.push("meter:"+i); });
  return base;
}
function wizOpen(){ W={draft:emptyHouse(), i:0}; wizDraw(); }
function wizDraw(){
  var steps=wizSteps(), key=steps[W.i], d=fieldQ(key,W.draft), segs="";
  for(var i=0;i<steps.length;i++) segs+='<i class="'+(i<=W.i?'on':'')+'"></i>';
  openSheet(
    '<div class="wprog">'+segs+'</div>'+
    '<div class="eyb">New property · Step '+(W.i+1)+' of '+steps.length+'</div>'+
    '<h3>'+esc(d.q)+'</h3>'+
    '<p class="ssub">'+esc(d.s||"Skip anything you do not know yet.")+'</p>'+
    fieldHTML(key,getP(W.draft,key),W.draft,"wiz")+
    (d.t==="choice" ? '' :
      '<div class="brow">'+
      '<button class="btn btn-ghost" data-wiz="back"'+(W.i===0?' disabled':'')+'>Back</button>'+
      '<button class="btn btn-primary" data-wiz="next">'+(W.i===steps.length-1?"Finish":"Continue")+'</button></div>'+
      (d.req?'':'<button class="skip" data-wiz="skip">Skip for now</button>')),
    true
  );
  focusField();
}
function wizGo(dir){
  var steps=wizSteps(), key=steps[W.i];
  if(dir==="back"){ if(W.i>0){ W.i--; wizDraw(); } return; }
  if(dir==="next" && !readField(key,W.draft)) return;
  if(W.i < wizSteps().length-1){ W.i++; wizDraw(); return; }
  var h=W.draft;
  if(!h.name){ toast("The property needs a name"); return; }
  if(h.type==="own") h.tenant={name:"",phone:"",rent:0,deposit:"",since:""};
  h.added=Date.now();
  D.houses.push(h); save(); closeSheet(); go("home");
  toast(h.name+" added");
}

function doRestore(raw){
  raw=String(raw||"").trim();
  if(!raw){ toast("Paste the backup text first"); return; }
  var pj; try{ pj=JSON.parse(raw); }catch(err){ toast("That is not a valid backup"); return; }
  if(!pj || !pj.houses){ toast("No property data found in that backup"); return; }
  confirmSheet("Restore this backup?","It holds "+plural(pj.houses.length,"property","properties")+". Everything currently in the app will be replaced.","Restore",function(){
    D=migrate({v:pj.v||1, houses:pj.houses||[], entries:pj.entries||{}, demo:!!pj.demo, settings:pj.settings||D.settings});
    save(); closeSheet(); go("home"); toast("Backup restored");
  });
}
function csvExport(){
  var rows=[["Month","Property","Tenant","Item","Reference","Amount","Status","Due date","Paid on","Note"]];
  var months=Object.keys(D.entries).sort();
  months.forEach(function(mk){
    D.houses.forEach(function(h){
      houseMonth(h,mk).rows.forEach(function(x){
        if(x.s==="none" && !x.it.note) return;
        rows.push([mName(mk),h.name,getP(h,"tenant.name"),x.item.name,x.item.meter?x.item.meter.ref:"",x.a,ST[x.s],
          x.d||"",x.it.paidOn||"",x.it.note||""]);
      });
    });
  });
  var csv=rows.map(function(r){ return r.map(function(c){ c=String(c==null?"":c);
    return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(","); }).join("\r\n");
  download("kiraya-records-"+today()+".csv","﻿"+csv,"text/csv");
}

/* ═══════════════════ events ═══════════════════ */
document.addEventListener("input",function(e){
  if(e.target.id==="q"){ S.q=e.target.value; var pl=document.getElementById("plist"); if(pl) pl.innerHTML=propList(); }
});
document.addEventListener("change",function(e){
  if(e.target.id==="fp"){ var b=document.getElementById("pbx"); if(b){ b.classList.toggle("on",e.target.checked);
    b.querySelector(".tick").classList.toggle("on",e.target.checked); } }
  if(e.target.id==="m-prov" && MS){ var p=provOf(MS.d.kind,e.target.value); var u=document.getElementById("m-url"); if(u) u.value=p.u; }
});

document.addEventListener("click",function(e){
  var t=e.target,n;
  if((n=t.closest("[data-tab]"))){ go(n.getAttribute("data-tab")); return; }
  if((n=t.closest("[data-mv]"))){
    var dv=+n.getAttribute("data-mv");
    S.month = dv===0 ? nowM() : mShift(S.month,dv);
    S.anim=true; render(); return;
  }
  if((n=t.closest("[data-filter]"))){ S.filter=n.getAttribute("data-filter"); render(); return; }
  if((n=t.closest("[data-ptype]"))){ S.ptype=n.getAttribute("data-ptype"); render(); return; }
  if((n=t.closest("[data-tick]"))){
    e.preventDefault(); e.stopPropagation();
    var p=n.getAttribute("data-tick").split("|"), h=houseById(p[0]);
    var it=ensure(S.month,p[0],p[1]), before=JSON.parse(JSON.stringify(it)), mk=S.month;
    it.paid=!it.paid;
    if(it.paid){
      if((it.amount===""||it.amount==null) && p[1]==="rent" && h) it.amount=getP(h,"tenant.rent")||"";
      it.paidOn=it.paidOn||today();
    } else it.paidOn="";
    save(); render();
    var nb=document.querySelector('[data-tick="'+p[0]+'|'+p[1]+'"]'); if(nb) nb.classList.add("pop");
    var itm=h?itemOf(h,p[1]):null;
    toast((itm?itm.name:"Item")+(it.paid?" marked paid":" marked unpaid"),function(){
      var cur=ensure(mk,p[0],p[1]); for(var k in before) cur[k]=before[k]; save(); render();
    });
    return;
  }
  if((n=t.closest("[data-qa]"))){ var fa=document.getElementById("fa"); if(fa) fa.value=n.getAttribute("data-qa"); return; }
  if((n=t.closest("[data-qd]"))){ var fv=document.getElementById("fv")||document.getElementById("sv"); if(fv) fv.value=n.getAttribute("data-qd"); return; }
  if((n=t.closest("[data-item]"))){ var q=n.getAttribute("data-item").split("|"); itemSheet(q[0],q[1]); return; }
  if((n=t.closest("[data-toggle]"))){ var id=n.getAttribute("data-toggle"); S.open[id]=!S.open[id]; render(); return; }
  if((n=t.closest("[data-copy]"))){ copy(n.getAttribute("data-copy"),"Reference number"); return; }
  if((n=t.closest("[data-edit]"))){ var w=n.getAttribute("data-edit").split("|"); editSheet(w[0],w[1]); return; }
  if((n=t.closest("[data-meter]"))){ var y=n.getAttribute("data-meter").split("|"); meterSheet(y[0],y[1]); return; }
  if((n=t.closest("[data-detail]"))){ detailSheet(n.getAttribute("data-detail")); return; }
  if((n=t.closest("[data-mkind]"))){
    if(!MS) return;
    meterRead();
    var k=n.getAttribute("data-mkind");
    if(k!==MS.d.kind){ MS.d.kind=k; var pp=k==="electric"?provOf(k,SET().defElec):KINDS[k].providers[0]; MS.d.prov=pp.n; MS.d.url=pp.u; }
    meterDraw(); return;
  }
  if(t.closest("[data-savemeter]")){ meterSave(); return; }
  if(t.closest("[data-delmeter]")){ meterDelete(); return; }
  if((n=t.closest("[data-back]"))){ detailSheet(n.getAttribute("data-back")); return; }
  if((n=t.closest("[data-saveitem]"))){ var v=n.getAttribute("data-saveitem").split("|"); saveItem(v[0],v[1]); return; }
  if(t.closest("[data-confirm]")){ var f=CF; CF=null; if(f) f(); else closeSheet(); return; }
  if((n=t.closest("[data-sort]"))){ D.settings.sort=n.getAttribute("data-sort"); save(); closeSheet(); render(); toast("Sorted by "+SORTS[D.settings.sort].toLowerCase()); return; }
  if((n=t.closest("[data-theme-set]"))){ D.settings.theme=n.getAttribute("data-theme-set"); save(); render(); return; }
  if((n=t.closest("[data-set]"))){ setSheet(n.getAttribute("data-set")); return; }
  if((n=t.closest("[data-tplreset]"))){ var tk=n.getAttribute("data-tplreset"); var ta=document.getElementById("sv"); if(ta) ta.value=DEF_SETTINGS[tk]; return; }
  if((n=t.closest("[data-saveset]"))){
    var sk=n.getAttribute("data-saveset"), el=document.getElementById("sv"), val=el?el.value:"";
    if(SETF[sk].ty==="day") val=Math.min(28,Math.max(1,+val||5));
    else if(SETF[sk].ty!=="tpl") val=String(val).trim();
    if(sk==="title" && !val) val=DEF_SETTINGS.title;
    D.settings[sk]=val; save(); closeSheet(); render(); toast("Saved"); return;
  }

  if((n=t.closest("[data-pick]"))){
    var pv=n.getAttribute("data-pick"), pk=n.closest("[data-pickfor]");
    var host=pk?pk.getAttribute("data-pickfor"):"wiz";
    if(host==="wiz"){ if(W){ W.draft.type=pv; W.i++; wizDraw(); } return; }
    var eh=houseById(host);
    if(eh){ eh.type=pv; if(pv==="own") eh.tenant={name:"",phone:"",rent:0,deposit:"",since:""};
      save(); render(); detailSheet(host); toast("Saved"); }
    return;
  }
  if((n=t.closest("[data-wiz]"))){
    var a=n.getAttribute("data-wiz");
    if(a==="skip"){ if(W.i<wizSteps().length-1){ W.i++; wizDraw(); } else wizGo("finish"); return; }
    wizGo(a); return;
  }
  if((n=t.closest("[data-savefield]"))){
    var z=n.getAttribute("data-savefield").split("|"), hh=houseById(z[0]);
    if(!hh) return;
    if(!readField(z[1],hh)) return;
    if(hh.type==="own") hh.tenant={name:"",phone:"",rent:0,deposit:"",since:""};
    save(); render(); detailSheet(z[0]); toast("Saved"); return;
  }
  if((n=t.closest("[data-del]"))){
    var did=n.getAttribute("data-del"), tg=houseById(did);
    confirmSheet("Delete this property?",'"'+(tg?tg.name:"")+'" and its complete payment history will be removed. This cannot be undone.',"Delete",function(){
      D.houses=D.houses.filter(function(x){ return x.id!==did; });
      Object.keys(D.entries).forEach(function(m){ if(D.entries[m]) delete D.entries[m][did]; });
      save(); closeSheet(); render(); toast("Property deleted");
    },true);
    return;
  }
  if((n=t.closest("[data-remind]")) || (n=t.closest("[data-receipt]"))){
    var isR=n.hasAttribute("data-receipt");
    var rh=houseById(n.getAttribute(isR?"data-receipt":"data-remind")); if(!rh) return;
    var amount=amtOf(rh,{key:"rent"},pick(peek(S.month,rh.id),"rent"),S.month);
    var msg=fillTpl(isR?SET().tplReceipt:SET().tplRemind, rh, amount, S.month);
    window.open("https://wa.me/"+waNum(getP(rh,"tenant.phone"))+"?text="+encodeURIComponent(msg),"_blank","noopener");
    return;
  }

  if((n=t.closest("[data-act]"))){
    var act=n.getAttribute("data-act");
    if(act==="newhouse"){ wizOpen(); return; }
    if(act==="sort"){ sortSheet(); return; }
    if(act==="theme"){ D.settings.theme=isDark()?"light":"dark"; save(); render(); return; }
    if(act==="install"){
      var dp=INSTALL.p; if(!dp) return;
      INSTALL.p=null; render(); dp.prompt();
      if(dp.userChoice) dp.userChoice.then(function(c){ toast(c && c.outcome==="accepted" ? "Installing" : "Maybe later"); });
      return;
    }
    if(act==="cleardemo"){
      confirmSheet("Clear sample data?","All example properties and bills are removed so you can start with your own.","Clear",function(){
        D={v:VERSION, houses:[], entries:{}, demo:false, settings:D.settings}; save(); closeSheet(); go("home");
        toast("Ready — add your first property");
      });
      return;
    }
    if(act==="loaddemo"){
      confirmSheet("Load sample data?","Your current properties and history will be replaced with examples. Take a backup first if needed.","Load samples",function(){
        D=seed(D.settings); save(); closeSheet(); go("home"); toast("Sample data loaded");
      },true);
      return;
    }
    if(act==="copybk"){ copy(JSON.stringify(D),"Backup"); return; }
    if(act==="bkfile"){ download("kiraya-backup-"+today()+".json",JSON.stringify(D),"application/json"); return; }
    if(act==="csv"){ csvExport(); return; }
    if(act==="restore"){ restoreSheet(); return; }
    if(act==="restoretext"){ var bi=document.getElementById("bi"); doRestore(bi?bi.value:""); return; }
    if(act==="wipe"){
      confirmSheet("Erase everything?","Every property, every bill and the full history will be removed for good. Download a backup first.","Erase all",function(){
        D={v:VERSION, houses:[], entries:{}, demo:false, settings:D.settings}; save(); closeSheet(); go("home");
        toast("Register erased");
      },true);
      return;
    }
  }
  if(t.closest("[data-close]") || t.getAttribute("data-bg")==="1"){ closeSheet(); return; }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape") closeSheet();
  if(e.key==="Enter" && e.target && e.target.id==="fv"){ var nx=document.querySelector('[data-wiz="next"],[data-savefield]'); if(nx){ e.preventDefault(); nx.click(); } }
});

/* ═══════════ PWA: service worker + install ═══════════ */
(function pwa(){
  var head=document.head; if(!head) return;
  var hosted = /^https?:$/.test(location.protocol);
  if(hosted && navigator.serviceWorker){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        if(reg && reg.update) reg.update();
      }).catch(function(){});
    });
  }
})();

window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); INSTALL.p=e; render(); });
window.addEventListener("appinstalled", function(){ INSTALL.p=null; render(); toast("Installed — find the icon on your home screen"); });

render();
})();
